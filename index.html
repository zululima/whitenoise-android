.row.done{opacity:.4}.row.cur.done{opacity:1}
.n{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.en{white-space:pre-wrap}.fi{white-space:pre-wrap;font-weight:600}
.row.fixed .fi{text-decoration:line-through;font-weight:400;color:var(--mute)}

.ctx{grid-column:2/4;color:var(--mute);font-size:12.5px;display:none}.row.cur .ctx{display:block}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--mute)}
.inp{grid-column:3;display:none}.row.cur .inp{display:block}
.shot{grid-column:2;display:none;font-size:12px;color:var(--mute)}.row.cur .shot{display:block}
.frame{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff}
.frame img{position:absolute;left:0}.mark{position:absolute;border:2px solid #e5484d;border-radius:4px}
textarea{width:100%;font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--acc);background:var(--bg);color:var(--fg);resize:vertical;min-height:34px}
.ok{color:var(--ok);font-size:12px}

littu puhepalvelu on etusijalla. Muuten käytetään White Noisessa tekemääsi valintaa tai ainoaa saatavilla olevaa moottoria.", "ctx": ["Android dictation_strings: dictation_provider_precedence"], "tag": "", "shot": null}, {"id": "854", "en": "Finding speech providers…", "fi": "Etsitään puheentunnistuspalveluja…", "ctx": ["Android dictation_strings: dictation_provider_loading"], "tag": "", "shot": null}, {"id": "855", "en": "No speech provider found. Install and enable a speech provider, complete its setup, then return here. A keyboard may offer voice typing directly in its own controls.", "fi": "Puheentunnistuspalvelua ei löytynyt. Asenna ja ota käyttöön puheentunnistuspalvelu, viimeistele sen käyttöönotto ja palaa sitten tänne. Näppäimistö voi tarjota puhekirjoitusta suoraan omissa säätimissään.", "ctx": ["Android dictation_strings: dictation_provider_empty"], "tag": "", "shot": null}, {"id": "856", "en": "Works inside White Noise", "fi": "Toimii White Noisen sisällä", "ctx": ["Android dictation_strings: dictation_provider_in_app"], "tag": "", "shot": null}, {"id": "857", "en": "Opens provider window", "fi": "Avaa palvelun ikkunan", "ctx": ["Android dictation_strings: dictation_provider_window"], "tag": "", "shot": null}, {"id": "858", "en": "Keyboard only", "fi": "Vain näppäimistö", "ctx": ["Android dictation_strings: dictation_provider_keyboard"], "tag": "", "shot": null}, {"id": "859", "en": "In-app support not verified", "fi": "Sovelluksen sisäistä tukea ei ole varmistettu", "ctx": ["Android dictation_strings: dictation_provider_unknown"], "tag": "", "shot": null}, {"id": "860", "en": "Not sent", "fi": "Ei lähetetty", "ctx": ["Android dictation_strings: dictation_send_blocked"], "tag": "", "shot": null}, {"id": "861", "en": "Retry Send", "fi": "Yritä lähettää uudelleen", "ctx": ["Android dictation_strings: dictation_retry_send"], "tag": "", "shot": null}, {"id": "862", "en": "Dictation needs attention", "fi": "Sanelu vaatii huomiota", "ctx": ["Android dictation_strings: dictation_recovery_title"], "tag": "", "shot": null}, {"id": "863", "en": "Open White Noise to recover dictation. Retained audio is temporary and can be lost if Android stops the app.", "fi": "Avaa White Noise palauttaaksesi sanelun. Säilytetty ääni on väliaikainen ja voi kadota, jos Android pysäyttää sovelluksen.", "ctx": ["Android dictation_strings: dictation_recovery_text"], "tag": "", "shot": null}, {"id": "864", "en": "Open app", "fi": "Avaa sovellus", "ctx": ["Android dictation_strings: dictation_recovery_open"], "tag": "", "shot": null}, {"id": "865", "en": "Dictation recovery available in app", "fi": "Sanelun palautus saatavilla sovelluksessa", "ctx": ["Android dictation_strings: dictation_recovery_expired_title"], "tag": "", "shot": null}, {"id": "866", "en": "Background protection ended. Open White Noise to recover retained dictation.", "fi": "Taustasuojaus päättyi. Avaa White Noise palauttaaksesi säilytetyn sanelun.", "ctx": ["Android dictation_strings: dictation_recovery_expired_text"], "tag": "", "shot": null}, {"id": "867", "en": "Incomplete dictation", "fi": "Keskeneräinen sanelu", "ctx": ["Android dictation_strings: dictation_incomplete_title"], "tag": "", "shot": null}, {"id": "868", "en": "Transcription stopped before it finished. Review the recognized text in the draft before sending.", "fi": "Litterointi pysähtyi ennen kuin se valmistui. Tarkista tunnistettu teksti luonnoksessa ennen lähettämistä.", "ctx": ["Android dictation_strings: dictation_incomplete_text"], "tag": "", "shot": null}, {"id": "869", "en": "Send recognized text", "fi": "Lähetä tunnistettu teksti", "ctx": ["Android dictation_strings: dictation_send_recognized_text"], "tag": "", "shot": null}, {"id": "870", "en": "Remaining dictation audio", "fi": "Jäljellä oleva saneluääni", "ctx": ["Android dictation_strings: dictation_remaining_audio"], "tag": "", "shot": null}, {"id": "871", "en": "Recording stopped. Some audio is not transcribed.", "fi": "Nauhoitus pysähtyi. Osaa äänestä ei ole litteroitu.", "ctx": ["Android dictation_strings: dictation_stopped_remaining"], "tag": "", "shot": null}, {"id": "872", "en": "Retry transcribes the retained audio without recording or sending. Audio is temporary and can be lost if Android stops the app.", "fi": "Uusi yritys litteroi säilytetyn äänen nauhoittamatta tai lähettämättä. Ääni on väliaikainen ja voi kadota, jos Android pysäyttää sovelluksen.", "ctx": ["Android dictation_strings: dictation_remaining_explanation"], "tag": "", "shot": null}, {"id": "873", "en": "Retry remaining audio", "fi": "Litteroi jäljellä oleva ääni uudelleen", "ctx": ["Android dictation_strings: dictation_retry_remaining"], "tag": "", "shot": null}, {"id": "874", "en": "Keep for later", "fi": "Säilytä myöhempää varten", "ctx": ["Android dictation_strings: dictation_keep_later"], "tag": "", "shot": null}, {"id": "875", "en": "Discard untranscribed audio? Text already in the composer stays.", "fi": "Hylätäänkö litteroimaton ääni? Kirjoituskentässä jo oleva teksti säilyy.", "ctx": ["Android dictation_strings: dictation_discard_remaining"], "tag": "", "shot": null}, {"id": "876", "en": "Finishing microphone…", "fi": "Suljetaan mikrofonia…", "ctx": ["Android dictation_strings: dictation_finishing_microphone"], "tag": "", "shot": null}, {"id": "877", "en": "Could not check the retained audio. Keep it and try again.", "fi": "Säilytettyä ääntä ei voitu tarkistaa. Säilytä se ja yritä uudelleen.", "ctx": ["Android dictation_strings: dictation_audio_state_unavailable"], "tag": "", "shot": null}, {"id": "878", "en": "Finish dictation in the original conversation.", "fi": "Viimeistele sanelu alkuperäisessä keskustelussa.", "ctx": ["Android dictation_strings: dictation_original_conversation"], "tag": "", "shot": null}, {"id": "879", "en": "Chooses whether White Noise follows your device's light or dark setting, or always uses Light, Dark or AMOLED (pure black). The choice applies on this device only and takes effect immediately.", "fi": "Valitsee, seuraako White Noise laitteesi vaaleaa tai tummaa asetusta vai käyttääkö se aina Vaaleaa, Tummaa tai AMOLEDia (puhdas musta). Valinta koskee vain tätä laitetta ja tulee voimaan heti.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_theme"], "tag": "", "shot": null}, {"id": "880", "en": "Sets the accent color of buttons and highlights for the current theme. It applies to the active profile on this device, and backgrounds and surfaces stay neutral. You can reset it to the default.", "fi": "Määrittää painikkeiden ja korostusten korostusvärin nykyiselle teemalle. Se koskee aktiivista profiilia tällä laitteella, ja taustat ja pinnat pysyvät neutraaleina. Voit palauttaa oletuksen.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_action_color"], "tag": "", "shot": null}, {"id": "881", "en": "Sets the default colors of your message bubbles and of other people's bubbles for the current theme. It applies to the active profile on this device. Each chat can still have its own colors.", "fi": "Määrittää omien viestikupliesi ja muiden kuplien oletusvärit nykyiselle teemalle. Se koskee aktiivista profiilia tällä laitteella. Jokaisella keskustelulla voi silti olla omat värinsä.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_chat_bubble_colors"], "tag": "", "shot": null}, {"id": "882", "en": "Opens a list of typefaces for all text in White Noise. The choice applies on this device only and takes effect immediately. System uses your device's own font, and the other typefaces are built into the app.", "fi": "Avaa luettelon kirjasintyypeistä, joita voi käyttää kaikkeen White Noisen tekstiin. Valinta koskee vain tätä laitetta ja tulee voimaan heti. Järjestelmä käyttää laitteesi omaa fonttia, ja muut kirjasintyypit sisältyvät sovellukseen.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_app_font"], "tag": "", "shot": null}, {"id": "883", "en": "Opens the text size choices for White Noise. The size is added on top of your Android system font size, so both settings affect how large text looks. It applies on this device only and takes effect immediately.", "fi": "Avaa White Noisen tekstikoon vaihtoehdot. Koko lisätään Androidin järjestelmän fonttikoon päälle, joten molemmat asetukset vaikuttavat tekstin kokoon. Se koskee vain tätä laitetta ja tulee voimaan heti.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_font_size"], "tag": "", "shot": null}, {"id": "884", "en": "Opens the choices for how times and dates are written, such as 12-hour or 24-hour time and the order of day, month and year. The choice applies on this device only and takes effect immediately.", "fi": "Avaa vaihtoehdot sille, miten kellonajat ja päivämäärät kirjoitetaan, kuten 12 tai 24 tunnin kello ja päivän, kuukauden ja vuoden järjestys. Valinta koskee vain tätä laitetta ja tulee voimaan heti.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_date_time"], "tag": "", "shot": null}, {"id": "885", "en": "Shrinks White Noise text to 85 percent of the normal size. The change is added on top of your Android system font size and applies on this device only.", "fi": "Pienentää White Noisen tekstin 85 prosenttiin normaalikoosta. Muutos lisätään Androidin järjestelmän fonttikoon päälle ja koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_font_size_small"], "tag": "", "shot": null}, {"id": "886", "en": "Uses the normal White Noise text size, so text is as large as your Android system font size makes it. This is the starting setting, and it applies on this device only.", "fi": "Käyttää White Noisen normaalia tekstikokoa, joten teksti on niin suurta kuin Androidin järjestelmän fonttikoko sen tekee. Tämä on alkuasetus, ja se koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_font_size_default"], "tag": "", "shot": null}, {"id": "887", "en": "Enlarges White Noise text to 115 percent of the normal size. The change is added on top of your Android system font size and applies on this device only.", "fi": "Suurentaa White Noisen tekstin 115 prosenttiin normaalikoosta. Muutos lisätään Androidin järjestelmän fonttikoon päälle ja koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_font_size_large"], "tag": "", "shot": null}, {"id": "888", "en": "Enlarges White Noise text to 130 percent of the normal size. The change is added on top of your Android system font size and applies on this device only.", "fi": "Suurentaa White Noisen tekstin 130 prosenttiin normaalikoosta. Muutos lisätään Androidin järjestelmän fonttikoon päälle ja koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_font_size_extra_large"], "tag": "", "shot": null}, {"id": "889", "en": "Puts the White Noise text size back to Default, which follows your Android system font size without adding to it. The dialog stays open, and the change applies on this device only.", "fi": "Palauttaa White Noisen tekstikoon Oletukseksi, joka seuraa Androidin järjestelmän fonttikokoa lisäämättä siihen mitään. Ikkuna pysyy auki, ja muutos koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_font_size_reset"], "tag": "", "shot": null}, {"id": "890", "en": "Uses your Android device's own font for all text in White Noise. This is the starting setting, and the choice applies on this device only.", "fi": "Käyttää Android-laitteesi omaa fonttia kaikessa White Noisen tekstissä. Tämä on alkuasetus, ja valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_font_system"], "tag": "", "shot": null}, {"id": "891", "en": "Uses this typeface, which is built into the app, for all text in White Noise. The choice applies on this device only. Your Android system font size still applies as well.", "fi": "Käyttää tätä sovellukseen sisältyvää kirjasintyyppiä kaikessa White Noisen tekstissä. Valinta koskee vain tätä laitetta. Androidin järjestelmän fonttikoko on edelleen voimassa.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_font_bundled"], "tag": "", "shot": null}, {"id": "892", "en": "Writes times in the style your app language and region use, as a 12-hour or 24-hour clock. This is the starting setting, and it applies on this device only.", "fi": "Kirjoittaa kellonajat sovelluksen kielen ja alueesi tyylillä, joko 12 tai 24 tunnin kellona. Tämä on alkuasetus, ja se koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_date_time_time_automatic"], "tag": "", "shot": null}, {"id": "893", "en": "Always writes times on a 12-hour clock with AM and PM, whatever your language or region uses. The choice applies on this device only.", "fi": "Kirjoittaa kellonajat aina 12 tunnin kellona AM- ja PM-merkinnöin kielestäsi tai alueestasi riippumatta. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_date_time_time_12"], "tag": "", "shot": null}, {"id": "894", "en": "Always writes times on a 24-hour clock, whatever your language or region uses. The choice applies on this device only.", "fi": "Kirjoittaa kellonajat aina 24 tunnin kellona kielestäsi tai alueestasi riippumatta. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_date_time_time_24"], "tag": "", "shot": null}, {"id": "895", "en": "Writes dates in the order your app language and region use. This is the starting setting, and it applies on this device only.", "fi": "Kirjoittaa päivämäärät siinä järjestyksessä, jota sovelluksen kieli ja alueesi käyttävät. Tämä on alkuasetus, ja se koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_date_time_date_automatic"], "tag": "", "shot": null}, {"id": "896", "en": "Always writes short dates in the order shown by this example, whatever your language or region uses. The choice applies on this device only.", "fi": "Kirjoittaa lyhyet päivämäärät aina tämän esimerkin järjestyksessä kielestäsi tai alueestasi riippumatta. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_date_time_date_order"], "tag": "", "shot": null}, {"id": "897", "en": "Sets both time and date back to Automatic, which follow the app language and your region. This button is available only while you have changed one of them, and it applies on this device only.", "fi": "Palauttaa sekä kellonajan että päivämäärän Automaattiseksi, jolloin ne seuraavat sovelluksen kieltä ja aluettasi. Painike on käytettävissä vain, kun olet muuttanut jompaakumpaa, ja se koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_date_time_reset"], "tag": "", "shot": null}, {"id": "898", "en": "Shows or hides a sample chat where you can try right-to-left layout and larger text. Nothing you do in the preview changes your real settings.", "fi": "Näyttää tai piilottaa esimerkkikeskustelun, jossa voit kokeilla oikealta vasemmalle -asettelua ja suurempaa tekstiä. Mikään esikatselussa tekemäsi ei muuta varsinaisia asetuksiasi.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_preview_disclosure"], "tag": "", "shot": null}, {"id": "899", "en": "Shows the sample chat with a right-to-left layout, as used for languages such as Arabic and Hebrew. It changes only the preview and not the rest of the app.", "fi": "Näyttää esimerkkikeskustelun oikealta vasemmalle -asettelulla, jota käytetään esimerkiksi arabian ja heprean kaltaisissa kielissä. Se muuttaa vain esikatselua eikä muuta sovellusta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_preview_rtl"], "tag": "", "shot": null}, {"id": "900", "en": "Doubles the text size in the sample chat to show how larger text fits. It changes only the preview and not your font size settings.", "fi": "Kaksinkertaistaa tekstin koon esimerkkikeskustelussa, jotta näet, miten suurempi teksti mahtuu. Se muuttaa vain esikatselua eikä fonttikokoasetuksiasi.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_preview_large_text"], "tag": "", "shot": null}, {"id": "901", "en": "Turns off both preview switches and returns the sample chat to your real settings. Your actual app settings are not changed.", "fi": "Kytkee molemmat esikatselun kytkimet pois ja palauttaa esimerkkikeskustelun varsinaisiin asetuksiisi. Sovelluksen todellisia asetuksia ei muuteta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_preview_reset"], "tag": "", "shot": null}, {"id": "902", "en": "Switches the language of White Noise on this device. The change applies immediately. System follows the language set in your Android settings.", "fi": "Vaihtaa White Noisen kielen tällä laitteella. Muutos tulee voimaan heti. Järjestelmä seuraa Androidin asetuksissa valittua kieltä.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_language_option"], "tag": "", "shot": null}, {"id": "903", "en": "Keeps incoming messages silent while a podcast or audiobook plays, so it is not interrupted. Mentions still alert you. The setting applies on this device.", "fi": "Pitää saapuvat viestit äänettöminä podcastin tai äänikirjan soidessa, jotta sitä ei keskeytetä. Maininnoista ilmoitetaan silti. Asetus koskee tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_spoken_audio_alert"], "tag": "", "shot": null}, {"id": "904", "en": "Chooses what happens when you swipe a message to the left with your finger. The setting applies to every chat on this device. You can turn it off or pick another action.", "fi": "Valitsee, mitä tapahtuu, kun pyyhkäiset viestiä sormella vasemmalle. Asetus koskee kaikkia keskusteluja tällä laitteella. Voit poistaa sen käytöstä tai valita toisen toiminnon.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_gesture_message_left"], "tag": "", "shot": null}, {"id": "905", "en": "Chooses what happens when you swipe a message to the right with your finger. The setting applies to every chat on this device. You can turn it off or pick another action.", "fi": "Valitsee, mitä tapahtuu, kun pyyhkäiset viestiä sormella oikealle. Asetus koskee kaikkia keskusteluja tällä laitteella. Voit poistaa sen käytöstä tai valita toisen toiminnon.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_gesture_message_right"], "tag": "", "shot": null}, {"id": "906", "en": "Chooses what happens when you swipe a chat in the chat list to the left with your finger. It is off by default. The setting applies on this device only.", "fi": "Valitsee, mitä tapahtuu, kun pyyhkäiset keskusteluluettelossa keskustelua sormella vasemmalle. Se on oletuksena pois päältä. Asetus koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_gesture_chat_left"], "tag": "", "shot": null}, {"id": "907", "en": "Chooses what happens when you swipe a chat in the chat list to the right with your finger. It is off by default. The setting applies on this device only.", "fi": "Valitsee, mitä tapahtuu, kun pyyhkäiset keskusteluluettelossa keskustelua sormella oikealle. Se on oletuksena pois päältä. Asetus koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_gesture_chat_right"], "tag": "", "shot": null}, {"id": "908", "en": "Puts all swipe actions and the pull-down for unread chats back to their starting settings. Nothing in your chats changes, and the reset applies on this device only.", "fi": "Palauttaa kaikki pyyhkäisytoiminnot ja lukemattomien keskustelujen alasvedon alkuasetuksiinsa. Keskusteluissasi ei muutu mikään, ja palautus koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_gesture_reset"], "tag": "", "shot": null}, {"id": "909", "en": "Chooses which speech engine on your device reads messages aloud. Engines marked as on-device keep speech on your phone, while others may use the network. The choice applies on this device only.", "fi": "Valitsee, mikä laitteesi puhemoottori lukee viestit ääneen. Laitteella toimiviksi merkityt moottorit pitävät puheen puhelimessasi, kun taas muut voivat käyttää verkkoa. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_engine"], "tag": "", "shot": null}, {"id": "910", "en": "Chooses the voice used to read messages aloud. Automatic lets the speech engine choose the voice. Voices that are unavailable are shown with the reason. The choice applies on this device only.", "fi": "Valitsee äänen, jolla viestit luetaan ääneen. Automaattinen antaa puhemoottorin valita äänen. Ei saatavilla olevat äänet näytetään syyn kanssa. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_voice"], "tag": "", "shot": null}, {"id": "911", "en": "Sets how fast messages are read aloud. System follows the speech rate in your Android settings, or you can pick a preset or enter your own. The choice applies on this device only.", "fi": "Määrittää, kuinka nopeasti viestit luetaan ääneen. Järjestelmä seuraa Androidin asetusten puhenopeutta, tai voit valita valmiin nopeuden tai syöttää oman. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_rate"], "tag": "", "shot": null}, {"id": "912", "en": "Turns on reading unread messages aloud when you open a chat. Each chat can override this default and choose On or Off for itself. The setting applies on this device only.", "fi": "Ottaa käyttöön lukemattomien viestien lukemisen ääneen, kun avaat keskustelun. Jokainen keskustelu voi ohittaa tämän oletuksen ja valita itselleen Päällä tai Pois. Asetus koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_auto_read"], "tag": "", "shot": null}, {"id": "913", "en": "When on, read-aloud speech plays over music or other media that is already playing. When off, speech reads normally. The setting applies on this device only.", "fi": "Kun asetus on päällä, ääneen luettu puhe toistetaan jo soivan musiikin tai muun median päälle. Kun se on pois päältä, puhe luetaan normaalisti. Asetus koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_media_mix"], "tag": "", "shot": null}, {"id": "914", "en": "Sets how loud read-aloud speech is when it plays over other media: Quiet, Medium or Loud. It is available only while speaking over media is on, and applies on this device only.", "fi": "Määrittää, kuinka kovaa ääneen luettu puhe on, kun se toistetaan muun median päälle: hiljainen, keskitaso tai kova. Se on käytettävissä vain, kun median päälle puhuminen on päällä, ja koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_mix_volume"], "tag": "", "shot": null}, {"id": "915", "en": "Checks again which speech engines and voices are installed on your device. Use it after installing or removing a speech engine. It changes none of your settings.", "fi": "Tarkistaa uudelleen, mitkä puhemoottorit ja äänet laitteellesi on asennettu. Käytä sitä puhemoottorin asentamisen tai poistamisen jälkeen. Se ei muuta asetuksiasi.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_refresh"], "tag": "", "shot": null}, {"id": "916", "en": "Opens your Android device's own text-to-speech settings, where you can install voices and manage speech engines. When you come back, White Noise rechecks what is available.", "fi": "Avaa Android-laitteesi omat tekstistä puheeksi -asetukset, joissa voit asentaa ääniä ja hallita puhemoottoreita. Kun palaat, White Noise tarkistaa uudelleen, mitä on saatavilla.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_android_settings"], "tag": "", "shot": null}, {"id": "917", "en": "Chooses whether this chat reads unread messages aloud when you open it. You can follow your default or force it On or Off for this chat. The choice applies on this device only.", "fi": "Valitsee, luetaanko tämän keskustelun lukemattomat viestit ääneen, kun avaat sen. Voit seurata oletustasi tai pakottaa asetuksen tässä keskustelussa Päälle tai Pois. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_auto_read_group"], "tag": "", "shot": null}, {"id": "918", "en": "Follows your global Read Aloud default for this chat, which is shown in parentheses. If you change the default later, this chat changes with it.", "fi": "Seuraa tässä keskustelussa yleistä Lue ääneen -oletustasi, joka näkyy suluissa. Jos muutat oletusta myöhemmin, tämä keskustelu muuttuu sen mukana.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_auto_read_default"], "tag": "", "shot": null}, {"id": "919", "en": "Always reads unread messages aloud when you open this chat, whatever your default says. The choice applies on this device only.", "fi": "Lukee lukemattomat viestit aina ääneen, kun avaat tämän keskustelun, oletuksestasi riippumatta. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_auto_read_on"], "tag": "", "shot": null}, {"id": "920", "en": "Never reads messages aloud automatically when you open this chat, whatever your default says. The choice applies on this device only.", "fi": "Ei koskaan lue viestejä automaattisesti ääneen, kun avaat tämän keskustelun, oletuksestasi riippumatta. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_tts_auto_read_off"], "tag": "", "shot": null}, {"id": "921", "en": "Chooses which speech recognition service turns your voice into text in the message box. Automatic picks one for you. The choice applies on this device only.", "fi": "Valitsee, mikä puheentunnistuspalvelu muuttaa puheesi tekstiksi viestikentässä. Automaattinen valitsee sen puolestasi. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_dictation_provider"], "tag": "", "shot": null}, {"id": "922", "en": "Pauses music and podcasts while you dictate and resumes them afterwards. White Noise speech and voice messages always pause. The setting applies on this device only.", "fi": "Keskeyttää musiikin ja podcastit sanelun ajaksi ja jatkaa niitä sen jälkeen. White Noisen puhe ja ääniviestit keskeytetään aina. Asetus koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_dictation_pause_other_audio"], "tag": "", "shot": null}, {"id": "923", "en": "Chooses when dictation ends: when you choose Paste or Send, or automatically after a set number of seconds of silence. The setting applies on this device only.", "fi": "Valitsee, milloin sanelu päättyy: kun valitset Liitä tai Lähetä, tai automaattisesti tietyn sekuntimäärän hiljaisuuden jälkeen. Asetus koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_dictation_finish"], "tag": "", "shot": null}, {"id": "924", "en": "Chooses what happens to the text when dictation ends by silence: it is pasted into your draft, or sent as a message. Sending happens only if the chat and draft are unchanged. The setting applies on this device only.", "fi": "Valitsee, mitä tekstille tapahtuu, kun sanelu päättyy hiljaisuuteen: se liitetään luonnokseesi tai lähetetään viestinä. Lähetys tapahtuu vain, jos keskustelu ja luonnos ovat ennallaan. Asetus koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_dictation_result"], "tag": "", "shot": null}, {"id": "925", "en": "Opens your Android device's own voice input settings, where you can manage speech recognition services and keyboard voice typing.", "fi": "Avaa Android-laitteesi omat puhesyöteasetukset, joissa voit hallita puheentunnistuspalveluja ja näppäimistön äänikirjoitusta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_dictation_android_settings"], "tag": "", "shot": null}, {"id": "926", "en": "Opens the Offline Speech to Text listing on Zapstore, an app store. It is recommended for private dictation done on your device, and it is not available on Google Play.", "fi": "Avaa Offline Speech to Text -sovelluksen sivun Zapstoressa, joka on sovelluskauppa. Sitä suositellaan yksityiseen, laitteella tehtävään saneluun, eikä se ole saatavilla Google Playssa.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_dictation_ostt"], "tag": "", "shot": null}, {"id": "927", "en": "Lets White Noise choose a speech recognition service for you each time you dictate. The choice applies on this device only.", "fi": "Antaa White Noisen valita sinulle puheentunnistuspalvelun aina, kun sanelet. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_dictation_provider_automatic"], "tag": "", "shot": null}, {"id": "928", "en": "Uses this speech recognition engine for dictation in the message box. The label below it shows how it can be used. The choice applies on this device only.", "fi": "Käyttää tätä puheentunnistusmoottoria saneluun viestikentässä. Sen alla oleva merkintä kertoo, miten sitä voi käyttää. Valinta koskee vain tätä laitetta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_dictation_provider_engine"], "tag": "", "shot": null}, {"id": "929", "en": "Applies this preset color. You can still fine-tune it with the sliders or the hex code, and nothing is saved until you press Save.", "fi": "Käyttää tätä valmista väriä. Voit silti hienosäätää sitä liukusäätimillä tai hex-koodilla, eikä mitään tallenneta ennen kuin painat Tallenna.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_color_swatch"], "tag": "", "shot": null}, {"id": "930", "en": "Sets the base color, such as red, green or blue. Drag the slider below to change it. Nothing is saved until you press Save.", "fi": "Määrittää perusvärin, kuten punaisen, vihreän tai sinisen. Muuta sitä vetämällä alla olevaa liukusäädintä. Mitään ei tallenneta ennen kuin painat Tallenna.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_color_hue"], "tag": "", "shot": null}, {"id": "931", "en": "Sets how vivid the color is, from gray to full color. Drag the slider below to change it. Nothing is saved until you press Save.", "fi": "Määrittää, kuinka voimakas väri on, harmaasta täyteen väriin. Muuta sitä vetämällä alla olevaa liukusäädintä. Mitään ei tallenneta ennen kuin painat Tallenna.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_color_saturation"], "tag": "", "shot": null}, {"id": "932", "en": "Sets how light or dark the color is. Drag the slider below to change it. Nothing is saved until you press Save.", "fi": "Määrittää, kuinka vaalea tai tumma väri on. Muuta sitä vetämällä alla olevaa liukusäädintä. Mitään ei tallenneta ennen kuin painat Tallenna.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_color_brightness"], "tag": "", "shot": null}, {"id": "933", "en": "Saves this action color for the active profile and the current theme on this device. It is available once the color is valid and different from the saved one.", "fi": "Tallentaa tämän toimintovärin aktiiviselle profiilille ja nykyiselle teemalle tällä laitteella. Se on käytettävissä, kun väri on kelvollinen ja eri kuin tallennettu.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_action_color_save"], "tag": "", "shot": null}, {"id": "934", "en": "Removes your custom action color for the current theme and goes back to the default. It applies to the active profile on this device.", "fi": "Poistaa nykyisen teeman mukautetun toimintovärin ja palaa oletukseen. Se koskee aktiivista profiilia tällä laitteella.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_action_color_reset"], "tag": "", "shot": null}, {"id": "935", "en": "Saves the chosen bubble colors. They apply to the active profile on this device, or only to this chat when you opened this screen from a chat.", "fi": "Tallentaa valitut kuplien värit. Ne koskevat aktiivista profiilia tällä laitteella tai vain tätä keskustelua, jos avasit tämän näkymän keskustelusta.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_bubble_colors_save"], "tag": "", "shot": null}, {"id": "936", "en": "Opens a menu with a reset action that clears your custom bubble colors here and goes back to the defaults.", "fi": "Avaa valikon, jossa on palautustoiminto. Se poistaa täällä mukautetut kuplien värit ja palaa oletuksiin.", "ctx": ["Android explanation_appearance_strings: explanation_appearance_bubble_colors_menu"], "tag": "", "shot": null}, {"id": "937", "en": "Leaves this chat and removes it from this device. Other members stay in the chat, and you can only return if someone adds you again.", "fi": "Poistuu tästä keskustelusta ja poistaa sen tältä laitteelta. Muut jäsenet jäävät keskusteluun, ja voit palata vain, jos joku lisää sinut uudelleen.", "ctx": ["Android explanation_chats_strings: explanation_chat_actions_leave_and_delete"], "tag": "", "shot": null}, {"id": "938", "en": "Removes this chat and its messages from this device only. Nothing changes for anyone else in it.", "fi": "Poistaa tämän keskustelun ja sen viestit vain tältä laitteelta. Muille keskustelun osallistujille mikään ei muutu.", "ctx": ["Android explanation_chats_strings: explanation_chat_actions_delete"], "tag": "", "shot": null}, {"id": "939", "en": "Abandons this direct message and removes it from this device. The other person is not notified.", "fi": "Hylkää tämän yksityisviestin ja poistaa sen tältä laitteelta. Toiselle henkilölle ei ilmoiteta.", "ctx": ["Android explanation_chats_strings: explanation_chat_actions_abandon_dm"], "tag": "", "shot": null}, {"id": "940", "en": "Abandons this group and removes it from this device. Other members stay in the group.", "fi": "Hylkää tämän ryhmän ja poistaa sen tältä laitteelta. Muut jäsenet jäävät ryhmään.", "ctx": ["Android explanation_chats_strings: explanation_chat_actions_abandon_group"], "tag": "", "shot": null}, {"id": "941", "en": "Silences ordinary message alerts from this chat. Direct mentions can still notify you, and you still receive every message.", "fi": "Hiljentää tavalliset viesti-ilmoitukset tästä keskustelusta. Suorat maininnat voivat silti ilmoittaa sinulle, ja saat edelleen kaikki viestit.", "ctx": ["Android explanation_chats_strings: explanation_chat_info_mute"], "tag": "", "shot": null}, {"id": "942", "en": "Copies this person's public key to the clipboard. Their public key is the address people use to find and connect with them, so it is safe to share. It never includes their private key.", "fi": "Kopioi tämän henkilön julkisen avaimen leikepöydälle. Julkinen avain on osoite, jolla ihmiset löytävät hänet ja ottavat häneen yhteyttä, joten sen jakaminen on turvallista. Se ei koskaan sisällä hänen yksityistä avaintaan.", "ctx": ["Android explanation_chats_strings: explanation_chat_info_copy_peer_public_key"], "tag": "", "shot": null}, {"id": "943", "en": "Turns notifications for this chat back on.", "fi": "Ottaa tämän keskustelun ilmoitukset taas käyttöön.", "ctx": ["Android explanation_chats_strings: explanation_chat_info_unmute"], "tag": "", "shot": null}, {"id": "944", "en": "Sets whether new messages in this chat disappear after a chosen time. Messages already sent are not changed.", "fi": "Määrittää, katoavatko tämän keskustelun uudet viestit valitun ajan jälkeen. Jo lähetettyihin viesteihin se ei vaikuta.", "ctx": ["Android explanation_chats_strings: explanation_chat_info_disappearing"], "tag": "", "shot": null}, {"id": "945", "en": "Copies a link to this chat that you can share so others can ask to join.", "fi": "Kopioi linkin tähän keskusteluun. Voit jakaa sen, jotta muut voivat pyytää liittymistä.", "ctx": ["Android explanation_chats_strings: explanation_chat_info_copy_chat_link"], "tag": "", "shot": null}, {"id": "946", "en": "Shows and edits the relays this group uses to send and receive messages. Changes apply to the whole group.", "fi": "Näyttää ja muokkaa releitä, joiden kautta tämä ryhmä lähettää ja vastaanottaa viestejä. Muutokset koskevat koko ryhmää.", "ctx": ["Android explanation_chats_strings: explanation_chat_info_relays"], "tag": "", "shot": null}, {"id": "947", "en": "Hands the admin role to another member. You stay in the group, but the new admin can then manage it.", "fi": "Siirtää ylläpitäjän roolin toiselle jäsenelle. Pysyt ryhmässä, mutta uusi ylläpitäjä voi sen jälkeen hallita sitä.", "ctx": ["Android explanation_chats_strings: explanation_chat_info_transfer_admin"], "tag": "", "shot": null}, {"id": "948", "en": "Gives up your admin role and keeps you in the group as a regular member. Another admin can make you an admin again.", "fi": "Luovut ylläpitäjän roolista ja pysyt ryhmässä tavallisena jäsenenä. Toinen ylläpitäjä voi tehdä sinusta taas ylläpitäjän.", "ctx": ["Android explanation_chats_strings: explanation_chat_info_step_down"], "tag": "", "shot": null}, {"id": "949", "en": "Allows an admin to disband this group later. Turning this on does not disband it.", "fi": "Sallii ylläpitäjän lakkauttaa tämän ryhmän myöhemmin. Asetuksen käyttöönotto ei lakkauta ryhmää.", "ctx": ["Android explanation_chats_strings: explanation_group_enable_disbanding"], "tag": "", "shot": null}, {"id": "950", "en": "Permanently ends this group for every member. This cannot be undone.", "fi": "Lopettaa tämän ryhmän pysyvästi kaikilta jäseniltä. Tätä ei voi kumota.", "ctx": ["Android explanation_chats_strings: explanation_group_disband"], "tag": "", "shot": null}, {"id": "951", "en": "Opens the profile switcher so you can change which account you are using. Your other accounts stay signed in.", "fi": "Avaa profiilin vaihtimen, jossa voit vaihtaa käyttämääsi tiliä. Muut tilisi pysyvät kirjautuneina.", "ctx": ["Android explanation_chats_strings: explanation_chat_list_avatar_switch"], "tag": "", "shot": null}, {"id": "952", "en": "Opens settings, where you manage your account and the app. You have one account signed in.", "fi": "Avaa asetukset, joissa hallitset tiliäsi ja sovellusta. Sinulla on yksi kirjautunut tili.", "ctx": ["Android explanation_chats_strings: explanation_chat_list_avatar_settings"], "tag": "", "shot": null}, {"id": "953", "en": "Opens the AI agents settings, where you set up an agent you can message like a contact.", "fi": "Avaa tekoälyagenttien asetukset, joissa voit määrittää agentin, jolle voit lähettää viestejä kuin yhteystiedolle.", "ctx": ["Android explanation_chats_strings: explanation_new_message_talk_to_agent"], "tag": "", "shot": null}, {"id": "954", "en": "Your relay setup needs attention, so messages may not arrive. Opens your relays so you can check them.", "fi": "Releidesi asetukset vaativat huomiota, joten viestit eivät välttämättä tule perille. Avaa releesi, jotta voit tarkistaa ne.", "ctx": ["Android explanation_chats_strings: explanation_chats_fab_check_relays"], "tag": "", "shot": null}, {"id": "955", "en": "Makes this member an admin, who can manage the group. You can change this later.", "fi": "Tekee tästä jäsenestä ylläpitäjän, joka voi hallita ryhmää. Voit muuttaa tätä myöhemmin.", "ctx": ["Android explanation_chats_strings: explanation_new_message_admin"], "tag": "", "shot": null}, {"id": "956", "en": "Opens folder management, where you create, rename, reorder and delete your chat folders.", "fi": "Avaa kansioiden hallinnan, jossa voit luoda, nimetä uudelleen, järjestää ja poistaa keskustelukansioitasi.", "ctx": ["Android explanation_chats_strings: explanation_chat_list_manage_folders"], "tag": "", "shot": null}, {"id": "957", "en": "An app update is available or being handled. Opens settings where you can see its status.", "fi": "Sovelluspäivitys on saatavilla tai sitä käsitellään. Avaa asetukset, joissa näet sen tilan.", "ctx": ["Android explanation_chats_strings: explanation_app_update_icon"], "tag": "", "shot": null}, {"id": "958", "en": "Search filters are on, so results are limited. Opens the filters so you can change or clear them.", "fi": "Hakusuodattimet ovat päällä, joten tuloksia on rajattu. Avaa suodattimet, jotta voit muuttaa tai tyhjentää ne.", "ctx": ["Android explanation_chats_strings: explanation_search_filters_active"], "tag": "", "shot": null}, {"id": "959", "en": "Moves Read Aloud to the start of the previous message. It does not change the message.", "fi": "Siirtää ääneen lukemisen edellisen viestin alkuun. Se ei muuta viestiä.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_tts_previous_message"], "tag": "", "shot": null}, {"id": "960", "en": "Moves Read Aloud back to the start of the current sentence, or to the previous sentence if you are already at its start.", "fi": "Siirtää ääneen lukemisen nykyisen virkkeen alkuun tai edelliseen virkkeeseen, jos olet jo virkkeen alussa.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_tts_previous_sentence"], "tag": "", "shot": null}, {"id": "961", "en": "Skips to the next sentence in the message being read aloud.", "fi": "Siirtyy seuraavaan virkkeeseen ääneen luettavassa viestissä.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_tts_next_sentence"], "tag": "", "shot": null}, {"id": "962", "en": "Skips to the start of the next message. Read Aloud keeps going from there.", "fi": "Siirtyy seuraavan viestin alkuun. Ääneen lukeminen jatkuu siitä.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_tts_next_message"], "tag": "", "shot": null}, {"id": "963", "en": "Scrolls the chat back to the message being read aloud. It does not pause or restart the audio.", "fi": "Vierittää keskustelun takaisin ääneen luettavaan viestiin. Se ei keskeytä eikä aloita ääntä alusta.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_tts_resume_follow"], "tag": "", "shot": null}, {"id": "964", "en": "Throws away what you said. Nothing is sent or added to the message, and this cannot be undone.", "fi": "Hylkää sanomasi. Mitään ei lähetetä eikä lisätä viestiin, eikä tätä voi kumota.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_dictation_cancel"], "tag": "", "shot": null}, {"id": "965", "en": "Stops listening and sends the recognized text as a message. Use Paste transcript instead to review it before sending.", "fi": "Lopettaa kuuntelun ja lähettää tunnistetun tekstin viestinä. Valitse sen sijaan Liitä litterointi, jos haluat tarkistaa tekstin ennen lähettämistä.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_dictation_send"], "tag": "", "shot": null}, {"id": "966", "en": "Puts the recognized text into the message box without sending it, so you can edit it first.", "fi": "Lisää tunnistetun tekstin viestikenttään lähettämättä sitä, jotta voit ensin muokata sitä.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_dictation_paste"], "tag": "", "shot": null}, {"id": "967", "en": "Puts the recognized text into the message box without sending it.", "fi": "Lisää tunnistetun tekstin viestikenttään lähettämättä sitä.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_dictation_recovery_paste"], "tag": "", "shot": null}, {"id": "968", "en": "Tries again to send the recognized text as a message.", "fi": "Yrittää uudelleen lähettää tunnistetun tekstin viestinä.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_dictation_recovery_retry_send"], "tag": "", "shot": null}, {"id": "969", "en": "Opens Android settings for White Noise, where you can allow microphone access.", "fi": "Avaa White Noisen Android-asetukset, joissa voit sallia mikrofonin käytön.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_dictation_recovery_app_settings"], "tag": "", "shot": null}, {"id": "970", "en": "Opens Android speech recognition settings, where you can choose or install a recognition service.", "fi": "Avaa Androidin puheentunnistusasetukset, joissa voit valita tai asentaa tunnistuspalvelun.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_dictation_recovery_speech"], "tag": "", "shot": null}, {"id": "971", "en": "Starts listening again. What was recognized before is not added.", "fi": "Aloittaa kuuntelun uudelleen. Aiemmin tunnistettua tekstiä ei lisätä.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_dictation_recovery_retry"], "tag": "", "shot": null}, {"id": "972", "en": "Tries this dictation again with what was already recorded or recognized. It does not start listening again.", "fi": "Yrittää tätä sanelua uudelleen jo nauhoitetulla tai tunnistetulla sisällöllä. Kuuntelua ei aloiteta uudelleen.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_dictation_recovery_retry_retained"], "tag": "", "shot": null}, {"id": "973", "en": "Deletes this recording without sending it. This cannot be undone.", "fi": "Poistaa tämän nauhoituksen lähettämättä sitä. Tätä ei voi kumota.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_voice_discard"], "tag": "", "shot": null}, {"id": "974", "en": "Deletes this recording and starts a new one. Nothing is sent.", "fi": "Poistaa tämän nauhoituksen ja aloittaa uuden. Mitään ei lähetetä.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_voice_record_again"], "tag": "", "shot": null}, {"id": "975", "en": "Stops and deletes the recording without sending it. This cannot be undone.", "fi": "Pysäyttää ja poistaa nauhoituksen lähettämättä sitä. Tätä ei voi kumota.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_voice_delete"], "tag": "", "shot": null}, {"id": "976", "en": "Stops recording and lets you review it. Nothing is sent until you send it.", "fi": "Pysäyttää nauhoituksen, jotta voit kuunnella sen. Mitään ei lähetetä ennen kuin lähetät sen.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_voice_stop"], "tag": "", "shot": null}, {"id": "977", "en": "Sends the attachments shown here, with your caption, to this chat. Use Done to keep them in the composer instead.", "fi": "Lähettää tässä näkyvät liitteet kuvatekstin kanssa tähän keskusteluun. Valitse sen sijaan Valmis, jos haluat pitää ne kirjoituskentässä.", "ctx": ["Android explanation_conversation_strings: explanation_media_preview_send"], "tag": "", "shot": null}, {"id": "978", "en": "Saves your changes and returns to the composer. Nothing is sent, and items you unticked are removed from the draft.", "fi": "Tallentaa muutoksesi ja palaa kirjoituskenttään. Mitään ei lähetetä, ja valinnasta poistamasi kohteet poistetaan luonnoksesta.", "ctx": ["Android explanation_conversation_strings: explanation_media_preview_done"], "tag": "", "shot": null}, {"id": "979", "en": "Closes the preview without sending anything. Attachments you were still preparing to send are discarded.", "fi": "Sulkee esikatselun lähettämättä mitään. Lähetettäväksi valmisteltavat liitteet hylätään.", "ctx": ["Android explanation_conversation_strings: explanation_media_preview_cancel"], "tag": "", "shot": null}, {"id": "980", "en": "Opens a menu to add more photos or files to this message.", "fi": "Avaa valikon, josta voit lisätä tähän viestiin kuvia tai tiedostoja.", "ctx": ["Android explanation_conversation_strings: explanation_media_preview_add_more"], "tag": "", "shot": null}, {"id": "981", "en": "Opens this chat's details, such as its members and settings.", "fi": "Avaa tämän keskustelun tiedot, kuten jäsenet ja asetukset.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_header_details"], "tag": "", "shot": null}, {"id": "982", "en": "Scrolls to the next unread message that mentions you.", "fi": "Vierittää seuraavaan lukemattomaan viestiin, jossa sinut mainitaan.", "ctx": ["Android explanation_conversation_strings: explanation_conversation_jump_to_mention"], "tag": "", "shot": null}, {"id": "983", "en": "Scrolls the draft back to its first line. It does not change the text.", "fi": "Vierittää luonnoksen takaisin ensimmäiselle riville. Se ei muuta tekstiä.", "ctx": ["Android explanation_conversation_strings: explanation_composer_draft_top"], "tag": "", "shot": null}, {"id": "984", "en": "Searches the emoji list by name.", "fi": "Hakee emojiluettelosta nimen perusteella.", "ctx": ["Android explanation_conversation_strings: explanation_emoji_search"], "tag": "", "shot": null}, {"id": "985", "en": "Opens the settings where you choose your quick reaction emoji.", "fi": "Avaa asetukset, joissa valitset pikareaktioiden emojit.", "ctx": ["Android explanation_conversation_strings: explanation_emoji_configure"], "tag": "", "shot": null}, {"id": "986", "en": "Adds another answer to the poll, up to the allowed maximum.", "fi": "Lisää kyselyyn uuden vastausvaihtoehdon sallittuun enimmäismäärään asti.", "ctx": ["Android explanation_conversation_strings: explanation_poll_add_option"], "tag": "", "shot": null}, {"id": "987", "en": "Members can vote for one answer only.", "fi": "Jäsenet voivat äänestää vain yhtä vaihtoehtoa.", "ctx": ["Android explanation_conversation_strings: explanation_poll_single_choice"], "tag": "", "shot": null}, {"id": "988", "en": "Members can vote for more than one answer.", "fi": "Jäsenet voivat äänestää useampaa kuin yhtä vaihtoehtoa.", "ctx": ["Android explanation_conversation_strings: explanation_poll_multiple_choice"], "tag": "", "shot": null}, {"id": "989", "en": "Quotes this message in the composer so your reply is linked to it.", "fi": "Lainaa tämän viestin kirjoituskenttään, jotta vastauksesi liittyy siihen.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_reply"], "tag": "", "shot": null}, {"id": "990", "en": "Opens your message in the composer so you can change it.", "fi": "Avaa viestisi kirjoituskenttään, jotta voit muuttaa sitä.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_edit"], "tag": "", "shot": null}, {"id": "991", "en": "Turns on selection mode so you can pick several messages at once.", "fi": "Ottaa valintatilan käyttöön, jotta voit valita useita viestejä kerralla.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_select"], "tag": "", "shot": null}, {"id": "992", "en": "Lets you select part of this message's text.", "fi": "Voit valita osan tämän viestin tekstistä.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_select_text"], "tag": "", "shot": null}, {"id": "993", "en": "Copies the message text to your phone's clipboard.", "fi": "Kopioi viestin tekstin puhelimesi leikepöydälle.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_copy"], "tag": "", "shot": null}, {"id": "994", "en": "Opens a panel with a translation. Translation runs on your device through the Offline Translator app.", "fi": "Avaa paneelin, jossa on käännös. Käännös tehdään laitteellasi Offline Translator -sovelluksella.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_translate"], "tag": "", "shot": null}, {"id": "995", "en": "Reads this message aloud, then continues with the messages after it.", "fi": "Lukee tämän viestin ääneen ja jatkaa sen jälkeisillä viesteillä.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_read_aloud"], "tag": "", "shot": null}, {"id": "996", "en": "Reads this message aloud with code spoken exactly as written, then continues with the messages after it.", "fi": "Lukee tämän viestin ääneen niin, että koodi luetaan täsmälleen kirjoitetussa muodossa, ja jatkaa sen jälkeisillä viesteillä.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_read_code_literally"], "tag": "", "shot": null}, {"id": "997", "en": "Opens a chat picker. The chats you choose receive a new copy of this message.", "fi": "Avaa keskustelujen valitsimen. Valitsemasi keskustelut saavat tästä viestistä uuden kopion.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_forward"], "tag": "", "shot": null}, {"id": "998", "en": "Keeps this message in a small card on top of the chat. You can remove the card at any time.", "fi": "Pitää tämän viestin pienenä korttina keskustelun yläosassa. Voit poistaa kortin milloin tahansa.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_keep_on_screen"], "tag": "", "shot": null}, {"id": "999", "en": "Collapses this long message to a shorter preview.", "fi": "Tiivistää tämän pitkän viestin lyhyemmäksi esikatseluksi.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_show_less"], "tag": "", "shot": null}, {"id": "1000", "en": "Opens Android Share with this message. The app you choose receives it and is outside White Noise.", "fi": "Avaa Androidin jakovalikon tällä viestillä. Valitsemasi sovellus saa viestin, ja se on White Noisen ulkopuolella.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_share"], "tag": "", "shot": null}, {"id": "1001", "en": "Saves this message's attachments to your device.", "fi": "Tallentaa tämän viestin liitteet laitteellesi.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_save"], "tag": "", "shot": null}, {"id": "1002", "en": "Shows when this message was sent and received, who sent it, its ID and its status.", "fi": "Näyttää, milloin viesti lähetettiin ja vastaanotettiin, kuka sen lähetti, sen tunnuksen ja tilan.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_info"], "tag": "", "shot": null}, {"id": "1003", "en": "Opens a report form for this group’s admins, the White Noise team, or both. Nothing is sent until you confirm.", "fi": "Avaa ilmiantolomakkeen tämän ryhmän ylläpitäjille, White Noisen tiimille tai molemmille. Mitään ei lähetetä ennen kuin vahvistat.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_report"], "tag": "", "shot": null}, {"id": "1004", "en": "Lets you delete this message on this device only or for everyone. Deleting for everyone cannot be undone. Nothing is deleted until you choose.", "fi": "Voit poistaa tämän viestin vain tältä laitteelta tai kaikilta. Kaikilta poistamista ei voi kumota. Mitään ei poisteta ennen kuin valitset.", "ctx": ["Android explanation_conversation_strings: explanation_message_action_delete"], "tag": "", "shot": null}, {"id": "1005", "en": "Starts a new chat folder. You name it, then add chats by hand, set automatic rules, or both. Folders only change how this profile's chat list is sorted on this device.", "fi": "Aloittaa uuden keskustelukansion. Annat sille nimen ja lisäät sitten keskusteluja käsin, määrität automaattisia sääntöjä tai molempia. Kansiot muuttavat vain sitä, miten tämän profiilin keskusteluluettelo järjestetään tällä laitteella.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_create"], "tag": "", "shot": null}, {"id": "1006", "en": "Brings back any of the default Chats, Unread, Archived and Groups folders you deleted. Folders you edited or created stay as they are. It is dimmed when none are missing.", "fi": "Palauttaa poistamasi oletuskansiot Keskustelut, Lukemattomat, Arkistoidut ja Ryhmät. Muokkaamasi tai luomasi kansiot pysyvät ennallaan. Se on himmennetty, kun mitään ei puutu.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_restore_defaults"], "tag": "", "shot": null}, {"id": "1007", "en": "Opens a menu to edit this folder, move it up or down in the folder order, or delete it. Deleting a folder never deletes the chats in it.", "fi": "Avaa valikon, jossa voit muokata tätä kansiota, siirtää sitä ylös- tai alaspäin kansioiden järjestyksessä tai poistaa sen. Kansion poistaminen ei koskaan poista sen keskusteluja.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_actions"], "tag": "", "shot": null}, {"id": "1008", "en": "Saves this folder's name, chats, rules and display options. Until you save, none of your changes are kept. It is dimmed while the folder cannot be saved, for example when the name is empty.", "fi": "Tallentaa tämän kansion nimen, keskustelut, säännöt ja näyttöasetukset. Ennen tallennusta mitään muutoksistasi ei säilytetä. Se on himmennetty, kun kansiota ei voi tallentaa, esimerkiksi kun nimi on tyhjä.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_save"], "tag": "", "shot": null}, {"id": "1009", "en": "When on, the folder shows every active chat, and the other rules below are not needed. Turn it off to pick chats by hand or by rules.", "fi": "Kun asetus on päällä, kansio näyttää kaikki aktiiviset keskustelut, eikä alla olevia muita sääntöjä tarvita. Poista se käytöstä, jos haluat valita keskustelut käsin tai sääntöjen avulla.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_include_all"], "tag": "", "shot": null}, {"id": "1010", "en": "Opens a list where you choose chats to always keep in this folder, even when they do not match its rules. The number is how many you have picked.", "fi": "Avaa luettelon, josta valitset keskustelut, jotka pidetään aina tässä kansiossa, vaikka ne eivät vastaisi sen sääntöjä. Luku kertoo, montako olet valinnut.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_included_chats"], "tag": "", "shot": null}, {"id": "1011", "en": "Opens a list of people. Chats that include any person you pick are added to this folder. The number is how many people you have picked.", "fi": "Avaa henkilöluettelon. Keskustelut, joissa on mukana kuka tahansa valitsemasi henkilö, lisätään tähän kansioon. Luku kertoo, montako henkilöä olet valinnut.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_people"], "tag": "", "shot": null}, {"id": "1012", "en": "When on, only chats with unread messages can appear in this folder, in addition to your other rules. It applies when the folder is saved.", "fi": "Kun asetus on päällä, tässä kansiossa voi näkyä vain keskusteluja, joissa on lukemattomia viestejä, muiden sääntöjesi lisäksi. Se tulee voimaan, kun kansio tallennetaan.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_unread_only"], "tag": "", "shot": null}, {"id": "1013", "en": "When on, only chats where you have an unread mention can appear in this folder, in addition to your other rules.", "fi": "Kun asetus on päällä, tässä kansiossa voi näkyä vain keskusteluja, joissa on lukematon maininta sinusta, muiden sääntöjesi lisäksi.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_mentions_only"], "tag": "", "shot": null}, {"id": "1014", "en": "When on, only chats you have pinned can appear in this folder, in addition to your other rules.", "fi": "Kun asetus on päällä, tässä kansiossa voi näkyä vain kiinnittämiäsi keskusteluja muiden sääntöjesi lisäksi.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_pinned_only"], "tag": "", "shot": null}, {"id": "1015", "en": "When on, only group chats can appear in this folder. Direct chats are left out.", "fi": "Kun asetus on päällä, tässä kansiossa voi näkyä vain ryhmäkeskusteluja. Kahdenkeskiset keskustelut jätetään pois.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_groups_only"], "tag": "", "shot": null}, {"id": "1016", "en": "When on, only one-to-one chats can appear in this folder. Groups are left out.", "fi": "Kun asetus on päällä, tässä kansiossa voi näkyä vain kahdenkeskisiä keskusteluja. Ryhmät jätetään pois.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_direct_only"], "tag": "", "shot": null}, {"id": "1017", "en": "When on, only chats you have archived can appear in this folder.", "fi": "Kun asetus on päällä, tässä kansiossa voi näkyä vain arkistoimiasi keskusteluja.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_archived_only"], "tag": "", "shot": null}, {"id": "1018", "en": "When off, muted chats are kept out of this folder even if they match its other rules. Turn it on to let muted chats appear too.", "fi": "Kun asetus on pois päältä, mykistetyt keskustelut pidetään poissa tästä kansiosta, vaikka ne vastaisivat sen muita sääntöjä. Ota se käyttöön, jos haluat myös mykistettyjen keskustelujen näkyvän.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_include_muted"], "tag": "", "shot": null}, {"id": "1019", "en": "Opens a read-only list of the chats this folder would show with the rules and chats you have set right now, before you save.", "fi": "Avaa vain luku -luettelon keskusteluista, jotka tämä kansio näyttäisi juuri nyt määrittämilläsi säännöillä ja keskusteluilla, ennen tallennusta.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_preview"], "tag": "", "shot": null}, {"id": "1020", "en": "When on, this folder stays among your chat folders even when it has no chats. When off, it appears only while it has something to show.", "fi": "Kun asetus on päällä, tämä kansio pysyy keskustelukansioidesi joukossa, vaikka siinä ei olisi keskusteluja. Kun se on pois päältä, kansio näkyy vain, kun siinä on näytettävää.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_show_when_empty"], "tag": "", "shot": null}, {"id": "1021", "en": "Orders this folder's chats by their latest activity, newest first. Invitations and pinned chats still stay on top.", "fi": "Järjestää tämän kansion keskustelut viimeisimmän toiminnan mukaan uusimmasta alkaen. Kutsut ja kiinnitetyt keskustelut pysyvät silti ylimpänä.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_sort_recent"], "tag": "", "shot": null}, {"id": "1022", "en": "Orders this folder's chats alphabetically by name, A to Z. Invitations and pinned chats still stay on top.", "fi": "Järjestää tämän kansion keskustelut aakkosjärjestykseen nimen mukaan A:sta Ö:hön. Kutsut ja kiinnitetyt keskustelut pysyvät silti ylimpänä.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_sort_name"], "tag": "", "shot": null}, {"id": "1023", "en": "Puts chats with unread messages first in this folder. Invitations and pinned chats still stay on top.", "fi": "Näyttää tässä kansiossa ensin keskustelut, joissa on lukemattomia viestejä. Kutsut ja kiinnitetyt keskustelut pysyvät silti ylimpänä.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_sort_unread"], "tag": "", "shot": null}, {"id": "1024", "en": "Deletes this folder after you confirm. The chats in it are not deleted or moved; they stay in the rest of your chat list.", "fi": "Poistaa tämän kansion vahvistuksesi jälkeen. Sen keskusteluja ei poisteta eikä siirretä, vaan ne pysyvät muualla keskusteluluettelossasi.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_delete"], "tag": "", "shot": null}, {"id": "1025", "en": "Reveals a field where you can write a short note about this folder. The note shows next to the chat count in the folders list in Settings.", "fi": "Näyttää kentän, johon voit kirjoittaa lyhyen huomautuksen tästä kansiosta. Huomautus näkyy keskustelujen määrän vieressä Asetusten kansioluettelossa.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_add_description"], "tag": "", "shot": null}, {"id": "1026", "en": "Closes the editor and throws away the changes you have not saved. Choose Keep Editing to go back instead.", "fi": "Sulkee muokkaimen ja hylkää tallentamattomat muutokset. Valitse sen sijaan Jatka muokkaamista, jos haluat palata.", "ctx": ["Android explanation_organize_strings: explanation_organize_folder_discard"], "tag": "", "shot": null}, {"id": "1027", "en": "Matches chats that include the people you choose. You can require any one of them, all of them, or exclude chats that contain them.", "fi": "Vastaa keskusteluja, joissa on mukana valitsemiasi henkilöitä. Voit vaatia kenet tahansa heistä tai heidät kaikki tai jättää pois keskustelut, joissa he ovat.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_participants"], "tag": "", "shot": null}, {"id": "1028", "en": "Matches chats by whether they have unread messages. This includes chats you marked as unread by hand. You pick whether the folder shows read or unread chats.", "fi": "Vastaa keskusteluja sen mukaan, onko niissä lukemattomia viestejä. Tähän kuuluvat myös keskustelut, jotka merkitsit käsin lukemattomiksi. Valitset, näyttääkö kansio luetut vai lukemattomat keskustelut.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_unread"], "tag": "", "shot": null}, {"id": "1029", "en": "Matches chats that have unread messages mentioning you. You pick whether the folder shows chats with or without unread mentions.", "fi": "Vastaa keskusteluja, joissa on lukemattomia viestejä, joissa sinut mainitaan. Valitset, näyttääkö kansio keskustelut, joissa on lukemattomia mainintoja, vai ne, joissa ei ole.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_mentions"], "tag": "", "shot": null}, {"id": "1030", "en": "Matches chats where you have an unsent draft message. You pick whether the folder shows chats with or without a draft.", "fi": "Vastaa keskusteluja, joissa sinulla on lähettämätön viestiluonnos. Valitset, näyttääkö kansio keskustelut, joissa on luonnos, vai ne, joissa ei ole.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_draft"], "tag": "", "shot": null}, {"id": "1031", "en": "Matches chats with outgoing messages that have not been delivered yet. Some chats cannot be checked for this yet.", "fi": "Vastaa keskusteluja, joissa on lähteviä viestejä, joita ei ole vielä toimitettu. Joitakin keskusteluja ei voi vielä tarkistaa tämän suhteen.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_pending"], "tag": "", "shot": null}, {"id": "1032", "en": "Matches chats you have muted. You pick whether the folder shows muted chats or everything except them.", "fi": "Vastaa keskusteluja, jotka olet mykistänyt. Valitset, näyttääkö kansio mykistetyt keskustelut vai kaiken muun.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_muted"], "tag": "", "shot": null}, {"id": "1033", "en": "Matches chats you have archived. You pick whether the folder shows archived chats or everything except them.", "fi": "Vastaa keskusteluja, jotka olet arkistoinut. Valitset, näyttääkö kansio arkistoidut keskustelut vai kaiken muun.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_archived"], "tag": "", "shot": null}, {"id": "1034", "en": "Matches chats you have joined. Pending invitations and chats you are leaving or that are being closed do not count as accepted.", "fi": "Vastaa keskusteluja, joihin olet liittynyt. Odottavat kutsut sekä keskustelut, joista olet poistumassa tai jotka ollaan sulkemassa, eivät ole hyväksyttyjä.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_accepted"], "tag": "", "shot": null}, {"id": "1035", "en": "Matches either direct chats with one person or group chats. You pick which kind the folder shows.", "fi": "Vastaa joko kahdenkeskisiä keskusteluja tai ryhmäkeskusteluja. Valitset, kumpaa lajia kansio näyttää.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_type"], "tag": "", "shot": null}, {"id": "1036", "en": "Matches chats whose title contains the keyword you type. The match ignores upper and lower case.", "fi": "Vastaa keskusteluja, joiden otsikossa on kirjoittamasi hakusana. Isoilla ja pienillä kirjaimilla ei ole väliä.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_title"], "tag": "", "shot": null}, {"id": "1037", "en": "Matches chats you have pinned. You pick whether the folder shows pinned chats or everything except them.", "fi": "Vastaa keskusteluja, jotka olet kiinnittänyt. Valitset, näyttääkö kansio kiinnitetyt keskustelut vai kaiken muun.", "ctx": ["Android explanation_organize_strings: explanation_organize_filter_pinned"], "tag": "", "shot": null}, {"id": "1038", "en": "Limits this folder by read status. Choose Unread to show only chats with unread messages, or No unread messages to show only fully read chats. Tap the same side again to clear it.", "fi": "Rajaa tätä kansiota lukutilan mukaan. Valitse Lukemattomat näyttääksesi vain keskustelut, joissa on lukemattomia viestejä, tai Ei lukemattomia viestejä näyttääksesi vain kokonaan luetut keskustelut. Tyhjennä valinta napauttamalla samaa puolta uudelleen.", "ctx": ["Android explanation_organize_strings: explanation_organize_quick_unread"], "tag": "", "shot": null}, {"id": "1039", "en": "Limits this folder by unread mentions of you. Choose one side to show only chats with, or only chats without, unread mentions. Tap the same side again to clear it.", "fi": "Rajaa tätä kansiota sinua koskevien lukemattomien mainintojen mukaan. Valitse toinen puoli näyttääksesi vain keskustelut, joissa on lukemattomia mainintoja, tai vain ne, joissa ei ole. Tyhjennä valinta napauttamalla samaa puolta uudelleen.", "ctx": ["Android explanation_organize_strings: explanation_organize_quick_mentions"], "tag": "", "shot": null}, {"id": "1040", "en": "Limits this folder by drafts. Choose one side to show only chats where you have an unsent draft, or only chats without one. Tap the same side again to clear it.", "fi": "Rajaa tätä kansiota luonnosten mukaan. Valitse toinen puoli näyttääksesi vain keskustelut, joissa sinulla on lähettämätön luonnos, tai vain ne, joissa ei ole. Tyhjennä valinta napauttamalla samaa puolta uudelleen.", "ctx": ["Android explanation_organize_strings: explanation_organize_quick_draft"], "tag": "", "shot": null}, {"id": "1041", "en": "Limits this folder by muting. Choose one side to show only muted chats, or only chats that are not muted. Tap the same side again to clear it.", "fi": "Rajaa tätä kansiota mykistyksen mukaan. Valitse toinen puoli näyttääksesi vain mykistetyt keskustelut tai vain ne, joita ei ole mykistetty. Tyhjennä valinta napauttamalla samaa puolta uudelleen.", "ctx": ["Android explanation_organize_strings: explanation_organize_quick_muted"], "tag": "", "shot": null}, {"id": "1042", "en": "Limits this folder by pinning. Choose one side to show only pinned chats, or only chats that are not pinned. Tap the same side again to clear it.", "fi": "Rajaa tätä kansiota kiinnityksen mukaan. Valitse toinen puoli näyttääksesi vain kiinnitetyt keskustelut tai vain ne, joita ei ole kiinnitetty. Tyhjennä valinta napauttamalla samaa puolta uudelleen.", "ctx": ["Android explanation_organize_strings: explanation_organize_quick_pinned"], "tag": "", "shot": null}, {"id": "1043", "en": "Limits this folder by archiving. Choose one side to show only archived chats, or only chats that are not archived. Tap the same side again to clear it.", "fi": "Rajaa tätä kansiota arkistoinnin mukaan. Valitse toinen puoli näyttääksesi vain arkistoidut keskustelut tai vain ne, joita ei ole arkistoitu. Tyhjennä valinta napauttamalla samaa puolta uudelleen.", "ctx": ["Android explanation_organize_strings: explanation_organize_quick_archived"], "tag": "", "shot": null}, {"id": "1044", "en": "Limits this folder to direct chats with one person or to group chats. Tap the same side again to clear it.", "fi": "Rajaa tämän kansion kahdenkeskisiin keskusteluihin tai ryhmäkeskusteluihin. Tyhjennä valinta napauttamalla samaa puolta uudelleen.", "ctx": ["Android explanation_organize_strings: explanation_organize_quick_type"], "tag": "", "shot": null}, {"id": "1045", "en": "Clears the quick filters you chose above. The accepted-chats scope stays; you can change it under Advanced. The change applies when you save the folder.", "fi": "Tyhjentää yllä valitsemasi pikasuodattimet. Hyväksyttyjen keskustelujen rajaus säilyy, ja voit muuttaa sitä kohdassa Lisäasetukset. Muutos tulee voimaan, kun tallennat kansion.", "ctx": ["Android explanation_organize_strings: explanation_organize_quick_reset"], "tag": "", "shot": null}, {"id": "1046", "en": "Starts the folder's automatic rules with the standard setup, which skips archived chats and only includes chats you have joined. You can then adjust the quick filters below.", "fi": "Aloittaa kansion automaattiset säännöt vakioasetuksilla, jotka ohittavat arkistoidut keskustelut ja sisältävät vain keskustelut, joihin olet liittynyt. Voit sitten säätää alla olevia pikasuodattimia.", "ctx": ["Android explanation_organize_strings: explanation_organize_quick_start"], "tag": "", "shot": null}, {"id": "1047", "en": "Shows or hides the full rule editor. There you can combine filters in groups that match all or any of their parts, and exclude matches.", "fi": "Näyttää tai piilottaa koko sääntöeditorin. Siinä voit yhdistää suodattimia ryhmiin, jotka vastaavat kaikkia tai mitä tahansa osiaan, ja jättää osumia pois.", "ctx": ["Android explanation_organize_strings: explanation_organize_quick_advanced"], "tag": "", "shot": null}, {"id": "1048", "en": "Opens a list of things a chat can be checked for, such as people, unread messages or type. The new condition is only added to this folder when you save it.", "fi": "Avaa luettelon asioista, joiden perusteella keskustelun voi tarkistaa, kuten henkilöt, lukemattomat viestit tai tyyppi. Uusi ehto lisätään tähän kansioon vasta, kun tallennat sen.", "ctx": ["Android explanation_organize_strings: explanation_organize_add_filter"], "tag": "", "shot": null}, {"id": "1049", "en": "Shows or hides the conditions in this group. A group combines its conditions into one test that the folder rules can then match or exclude.", "fi": "Näyttää tai piilottaa tämän ryhmän ehdot. Ryhmä yhdistää ehtonsa yhdeksi testiksi, jota kansion säännöt voivat sitten vastata tai jättää pois.", "ctx": ["Android explanation_organize_strings: explanation_organize_group_toggle"], "tag": "", "shot": null}, {"id": "1050", "en": "Chooses how this group's conditions combine. Match all needs a chat to pass every condition; Match any needs it to pass at least one.", "fi": "Valitsee, miten tämän ryhmän ehdot yhdistetään. Kaikki ehdot vaatii, että keskustelu täyttää jokaisen ehdon. Mikä tahansa ehto vaatii, että se täyttää vähintään yhden.", "ctx": ["Android explanation_organize_strings: explanation_organize_group_match"], "tag": "", "shot": null}, {"id": "1051", "en": "Opens this condition so you can change what it checks, switch it to exclude matches, or remove it. Changes apply to the folder draft when you save the condition.", "fi": "Avaa tämän ehdon, jotta voit muuttaa, mitä se tarkistaa, vaihtaa sen jättämään osumat pois tai poistaa sen. Muutokset koskevat kansion luonnosta, kun tallennat ehdon.", "ctx": ["Android explanation_organize_strings: explanation_organize_condition_row"], "tag": "", "shot": null}, {"id": "1052", "en": "Shows or hides extra settings for this group, such as excluding every chat that matches it, and adding a nested group.", "fi": "Näyttää tai piilottaa tämän ryhmän lisäasetukset, kuten kaikkien ryhmää vastaavien keskustelujen poisjättämisen ja sisäkkäisen ryhmän lisäämisen.", "ctx": ["Android explanation_organize_strings: explanation_organize_group_options"], "tag": "", "shot": null}, {"id": "1053", "en": "Chooses whether chats matching this group are included in the folder or excluded from it. Exclude flips the result of the whole group.", "fi": "Valitsee, sisällytetäänkö tätä ryhmää vastaavat keskustelut kansioon vai jätetäänkö ne pois. Poisjättäminen kääntää koko ryhmän tuloksen.", "ctx": ["Android explanation_organize_strings: explanation_organize_group_not"], "tag": "", "shot": null}, {"id": "1054", "en": "Adds an empty group inside this one. Groups can be nested up to 4 levels deep, and a rule can hold up to 64 conditions and groups in total.", "fi": "Lisää tämän sisään tyhjän ryhmän. Ryhmiä voi olla sisäkkäin enintään 4 tasoa, ja säännössä voi olla yhteensä enintään 64 ehtoa ja ryhmää.", "ctx": ["Android explanation_organize_strings: explanation_organize_add_group"], "tag": "", "shot": null}, {"id": "1055", "en": "Removes this group and every condition inside it from the folder draft. Nothing else changes until you save the folder.", "fi": "Poistaa tämän ryhmän ja kaikki sen ehdot kansion luonnoksesta. Mikään muu ei muutu ennen kuin tallennat kansion.", "ctx": ["Android explanation_organize_strings: explanation_organize_remove_group"], "tag": "", "shot": null}, {"id": "1056", "en": "Chooses what this condition requires, for example the chat having the property or not having it. The options depend on the kind of condition.", "fi": "Valitsee, mitä tämä ehto vaatii, esimerkiksi että keskustelulla on ominaisuus tai ettei sillä ole sitä. Vaihtoehdot riippuvat ehdon lajista.", "ctx": ["Android explanation_organize_strings: explanation_organize_cond_mode"], "tag": "", "shot": null}, {"id": "1057", "en": "Opens your contacts and chat partners so you can pick the people this condition looks for. The number shows how many are selected.", "fi": "Avaa yhteystietosi ja keskustelukumppanisi, jotta voit valita henkilöt, joita tämä ehto etsii. Luku kertoo, montako on valittu.", "ctx": ["Android explanation_organize_strings: explanation_organize_cond_choose_people"], "tag": "", "shot": nu
