s: explanation_developer_key_packages"], "tag": "", "shot": null}, {"id": "1234", "en": "Lists groups that could not be safely loaded and lets you retry recovery. Nothing is deleted.", "fi": "Luettelee ryhmät, joita ei voitu ladata turvallisesti, ja antaa sinun yrittää palautusta uudelleen. Mitään ei poisteta.", "ctx": ["Android explanation_settings_strings: explanation_developer_quarantined_groups"], "tag": "", "shot": null}, {"id": "1235", "en": "Reloads the list of quarantined groups. It does not retry recovery.", "fi": "Lataa karanteenissa olevien ryhmien luettelon uudelleen. Se ei yritä palautusta uudelleen.", "ctx": ["Android explanation_settings_strings: explanation_quarantine_refresh"], "tag": "", "shot": null}, {"id": "1236", "en": "Retries the shared engine validation for this group. It does not delete history, bypass checks or rejoin the group.", "fi": "Yrittää uudelleen tämän ryhmän jaettua moottoritarkistusta. Se ei poista historiaa, ohita tarkistuksia eikä liity ryhmään uudelleen.", "ctx": ["Android explanation_settings_strings: explanation_quarantine_retry"], "tag": "", "shot": null}, {"id": "1237", "en": "Uses Google Firebase Cloud Messaging to briefly wake White Noise, which then checks securely for messages. Local notifications keep a connection open instead.", "fi": "Käyttää Google Firebase Cloud Messagingia herättämään White Noisen hetkeksi, minkä jälkeen se tarkistaa viestit turvallisesti. Paikalliset ilmoitukset pitävät sen sijaan yhteyden auki.", "ctx": ["Android explanation_settings_strings: explanation_notifications_push"], "tag": "", "shot": null}, {"id": "1238", "en": "Keeps a persistent connection while notifications are on and creates them on this device, instead of using push.", "fi": "Pitää yhteyden jatkuvasti auki, kun ilmoitukset ovat päällä, ja luo ilmoitukset tällä laitteella push-ilmoitusten sijaan.", "ctx": ["Android explanation_settings_strings: explanation_notifications_local"], "tag": "", "shot": null}, {"id": "1239", "en": "Shares feature use and app performance for all profiles on this device, with a temporary session ID and a resettable installation ID. It never includes account or group IDs.", "fi": "Jakaa ominaisuuksien käytön ja sovelluksen suorituskyvyn tiedot kaikista tämän laitteen profiileista väliaikaisen istuntotunnuksen ja nollattavan asennustunnuksen kanssa. Tiedot eivät koskaan sisällä tilien tai ryhmien tunnuksia.", "ctx": ["Android explanation_settings_strings: explanation_diagnostics_usage"], "tag": "", "shot": null}, {"id": "1240", "en": "Shares sanitized technical logs about groups from all profiles on this device with White Noise, separate from usage sharing. Turning it off stops new recording and uploads.", "fi": "Jakaa White Noiselle puhdistettuja teknisiä lokeja kaikkien tämän laitteen profiilien ryhmistä, erillään käyttötietojen jakamisesta. Asetuksen poistaminen käytöstä lopettaa uuden tallennuksen ja lähetykset.", "ctx": ["Android explanation_settings_strings: explanation_diagnostics_logs"], "tag": "", "shot": null}, {"id": "1241", "en": "Pulling down on the chat list shows only unread chats. Show all brings the full list back.", "fi": "Keskusteluluettelon vetäminen alas näyttää vain lukemattomat keskustelut. Näytä kaikki palauttaa koko luettelon.", "ctx": ["Android explanation_settings_strings: explanation_gestures_pull_unread"], "tag": "", "shot": null}, {"id": "1242", "en": "Allows automatic downloads on this kind of network. Every matching network rule must allow it, and manual downloads always work.", "fi": "Sallii automaattiset lataukset tämäntyyppisessä verkossa. Jokaisen sopivan verkkosäännön on sallittava se, ja manuaaliset lataukset toimivat aina.", "ctx": ["Android explanation_settings_strings: explanation_data_usage_download_switch"], "tag": "", "shot": null}, {"id": "1243", "en": "Explain", "fi": "Selitä", "ctx": ["Android explanation_strings: explanation_action_explain"], "tag": "", "shot": null}, {"id": "1244", "en": "Shows which of your accounts sends messages in this chat. It does not switch accounts.", "fi": "Näyttää, millä tileistäsi viestit lähetetään tässä keskustelussa. Se ei vaihda tiliä.", "ctx": ["Android explanation_strings: explanation_composer_sending_identity"], "tag": "", "shot": null}, {"id": "1245", "en": "Opens the actions that are not pinned to the toolbar, including Customize composer.", "fi": "Avaa toiminnot, joita ei ole kiinnitetty työkaluriville, mukaan lukien Mukauta kirjoituskenttää.", "ctx": ["Android explanation_strings: explanation_composer_more"], "tag": "", "shot": null}, {"id": "1246", "en": "Opens the emoji picker, including your custom emoji.", "fi": "Avaa emojivalitsimen, jossa ovat myös omat emojisi.", "ctx": ["Android explanation_strings: explanation_composer_emoji"], "tag": "", "shot": null}, {"id": "1247", "en": "Pastes what you copied into the message.", "fi": "Liittää kopioimasi sisällön viestiin.", "ctx": ["Android explanation_strings: explanation_composer_paste"], "tag": "", "shot": null}, {"id": "1248", "en": "Types what you say using Android speech recognition. White Noise asks for offline recognition, but your device may still use an online service.", "fi": "Kirjoittaa sanomasi Androidin puheentunnistuksella. White Noise pyytää offline-tunnistusta, mutta laitteesi voi silti käyttää verkkopalvelua.", "ctx": ["Android explanation_strings: explanation_composer_dictation"], "tag": "", "shot": null}, {"id": "1249", "en": "Turns translate mode on or off. While it is on, Send delivers the translation shown on the Will send line, and nothing is sent until a translation is ready.", "fi": "Ottaa käännöstilan käyttöön tai pois. Kun se on päällä, Lähetä lähettää Lähetetään-rivillä näkyvän käännöksen, eikä mitään lähetetä ennen kuin käännös on valmis.", "ctx": ["Android explanation_strings: explanation_composer_translate"], "tag": "", "shot": null}, {"id": "1250", "en": "Hold to record a voice message.", "fi": "Pidä painettuna nauhoittaaksesi ääniviestin.", "ctx": ["Android hot": null}, {"id": "1982", "en": "Prompt copied — paste it into your agent.", "fi": "Kehote kopioitu. Liitä se agenttiisi.", "ctx": ["Android strings: ai_agents_prompt_copied"], "tag": "", "shot": null}, {"id": "1983", "en": "Public key unavailable. Go back and try another profile.", "fi": "Julkinen avain ei ole saatavilla. Palaa takaisin ja kokeile toista profiilia.", "ctx": ["Android strings: ai_agents_public_key_unavailable"], "tag": "", "shot": null}, {"id": "1984", "en": "Set up %1$s", "fi": "Ota käyttöön: %1$s", "ctx": ["Android strings: ai_agents_setup_title"], "tag": "checked by the translator", "shot": null}, {"id": "1985", "en": "Paste this into %1$s. It shares only your public key and asks the agent to get your approval before installing. Use it only with an agent you trust.", "fi": "Liitä tämä kohteeseen %1$s. Se jakaa vain julkisen avaimesi ja pyytää agenttia kysymään hyväksyntääsi ennen asentamista. Käytä sitä vain agentin kanssa, johon luotat.", "ctx": ["Android strings: ai_agents_setup_instruction"], "tag": "checked by the translator", "shot": null}, {"id": "1986", "en": "Copy prompt", "fi": "Kopioi kehote", "ctx": ["Android strings: ai_agents_copy_prompt"], "tag": "", "shot": null}, {"id": "1987", "en": "Opening the connector documentation.", "fi": "Avataan connector-ohjeita.", "ctx": ["Android strings: ai_agents_docs_opened"], "tag": "", "shot": null}, {"id": "1988", "en": "Couldn’t open the connector docs.", "fi": "Connector-ohjeita ei voitu avata.", "ctx": ["Android strings: ai_agents_docs_failed"], "tag": "", "shot": null}, {"id": "1989", "en": "Manual setup", "fi": "Manuaalinen käyttöönotto", "ctx": ["Android strings: ai_agents_manual_setup_title"], "tag": "", "shot": null}, {"id": "1990", "en": "Then add the agent’s npub as a contact from %1$s.", "fi": "Lisää sitten agentin npub yhteystiedoksi kohdasta %1$s.", "ctx": ["Android strings: ai_agents_manual_setup_body"], "tag": "", "shot": null}, {"id": "1991", "en": "Install scripts, health checks, troubleshooting", "fi": "Asennusskriptit, toimintatarkistukset, vianmääritys", "ctx": ["Android strings: ai_agents_connector_docs_subtitle"], "tag": "", "shot": null}, {"id": "1992", "en": "This is an installation prompt for connecting this Hermes installation to White Noise through Marmot. Read the latest connector guide at https://github.com/marmot-protocol/mdk/blob/master/integrations/hermes/marmot/README.md / https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md. Explain to me how the connector works and what the installation will change. Then propose the installation steps for my public npub: %1$s, and ask for my approval before making any changes. Once I approve, install and verify the connector, then reply with your agent npub. Before proposing changes, confirm the intended Hermes profile, Hermes home, Marmot home/socket, agent account and service, and gateway instance; do not assume the default profile or overwrite another installation. Use the checksum-verified Hermes installer flow. Distinguish invite authorization from message-sender authorization. Guide me through the phone invitation and a test message, and verify that the selected profile replies in White Noise before calling pairing complete.", "fi": "Tämä on asennuskehote, jolla tämä Hermes-asennus yhdistetään White Noiseen Marmotin kautta. Lue uusin connector-opas osoitteessa https://github.com/marmot-protocol/mdk/blob/master/integrations/hermes/marmot/README.md / https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md. Selitä minulle, miten connector toimii ja mitä asennus muuttaa. Ehdota sitten asennusvaiheet julkiselle npubilleni %1$s ja pyydä hyväksyntääni ennen kuin teet muutoksia. Kun hyväksyn, asenna connector ja varmista sen toiminta, ja vastaa sitten agenttisi npubilla. Ennen kuin ehdotat muutoksia, varmista tarkoitettu Hermes-profiili, Hermes-kotihakemisto, Marmot-kotihakemisto ja -socket, agenttitili ja -palvelu sekä gateway-instanssi; älä oleta oletusprofiilia äläkä korvaa toista asennusta. Käytä tarkistussummalla varmennettua Hermes-asennusohjelman kulkua. Erota kutsujen valtuutus viestin lähettäjän valtuutuksesta. Opasta minut puhelimella tehtävän kutsun ja testiviestin läpi ja varmista, että valittu profiili vastaa White Noisessa, ennen kuin toteat parituksen valmiiksi.", "ctx": ["Android strings: agent_connector_hermes_prompt"], "tag": "", "shot": null}, {"id": "1993", "en": "Open-source agent by Block", "fi": "Blockin avoimen lähdekoodin agentti", "ctx": ["Android strings: agent_connector_goose_subtitle"], "tag": "", "shot": null}, {"id": "1994", "en": "This is an installation prompt for connecting this Goose setup to White Noise through Marmot. Read the authoritative Goose harness guide at https://github.com/marmot-protocol/mdk/blob/master/integrations/goose/marmot/README.md and the White Noise + Agents quickstart at https://github.com/marmot-protocol/mdk/blob/master/integrations/README.md. Explain how the connector works and what installation will change. Check the current harness guide for prerequisites. Confirm Goose CLI is installed, configured with a provider, and available on PATH, and this machine uses the same public relay set as my phone. Propose the installation steps for my public npub: %1$s and ask for approval before changing anything. After approval, use the checksum-verified install-goose-marmot.sh release flow with the isolated Goose home and my npub as the allowed welcomer. Explain the inherit execution profile and any confirmation limitations; do not select unrestricted execution without explicit acknowledgement and external isolation. The autonomous profile is unsupported. Verify wn-agent --version, wn-goose --version, and goose --version. Reply with your agent npub and ask me to invite it from White Noise and send a test message from this allowed npub. Do not report setup complete until wn-goose returns a reply through White Noise; otherwise mark device verification required. Non-empty attachment batches are unsupported by this harness.", "fi": "Tämä on asennuskehote, jolla tämä Goose-ympäristö yhdistetään White Noiseen Marmotin kautta. Lue ensisijainen Goose-harness-opas osoitteessa https://github.com/marmot-protocol/mdk/blob/master/integrations/goose/marmot/README.md ja White Noise + Agents -pikaopas osoitteessa https://github.com/marmot-protocol/mdk/blob/master/integrations/README.md. Selitä, miten connector toimii ja mitä asennus muuttaa. Tarkista edellytykset nykyisestä harness-oppaasta. Varmista, että Goose CLI on asennettu, siihen on määritetty palveluntarjoaja ja se löytyy PATHista, ja että tämä kone käyttää samoja julkisia releitä kuin puhelimeni. Ehdota asennusvaiheet julkiselle npubilleni %1$s ja pyydä hyväksyntää ennen kuin muutat mitään. Hyväksynnän jälkeen käytä tarkistussummalla varmennettua install-goose-marmot.sh-julkaisukulkua, eristettyä Goose-kotihakemistoa ja npubiani sallittuna kutsujana. Selitä inherit-suoritusprofiili ja sen vahvistusrajoitukset; älä valitse rajoittamatonta suoritusta ilman nimenomaista hyväksyntää ja ulkoista eristystä. Autonomous-profiilia ei tueta. Tarkista wn-agent --version, wn-goose --version ja goose --version. Vastaa agenttisi npubilla ja pyydä minua kutsumaan se White Noisesta ja lähettämään testiviesti tästä sallitusta npubista. Älä ilmoita käyttöönottoa valmiiksi ennen kuin wn-goose vastaa White Noisen kautta; muuten merkitse, että laitteella tehtävä varmistus tarvitaan. Tämä harness ei tue ei-tyhjiä liite-eriä.", "ctx": ["Android strings: agent_connector_goose_prompt"], "tag": "", "shot": null}, {"id": "1995", "en": "Help", "fi": "Ohje", "ctx": ["Android strings: help"], "tag": "", "shot": null}, {"id": "1996", "en": "Report this message", "fi": "Ilmianna tämä viesti", "ctx": ["Android strings: report_message_title"], "tag": "", "shot": null}, {"id": "1997", "en": "Your report goes to this group's admins, encrypted like any other message. They will see who reported it.", ovirran sisäistä dataa ei muuteta. Muut tiedostot lähetetään muuttamattomina.", "ctx": ["Android strings: photo_editor_quality_explanation"], "tag": "", "shot": null}, {"id": "3239", "en": "Edited photos use High quality. The original image is kept for further editing.", "fi": "Muokatut kuvat käyttävät korkeaa laatua. Alkuperäinen kuva säilytetään jatkomuokkausta varten.", "ctx": ["Android strings: photo_editor_original_edited"], "tag": "", "shot": null}, {"id": "3240", "en": "Shares group diagnostic logs for all profiles here.", "fi": "Jakaa kaikkien tämän laitteen profiilien ryhmien diagnostiikkalokit.", "ctx": ["Android strings: audit_upload_subtitle"], "tag": "", "shot": null}, {"id": "3241", "en": "Share group diagnostic logs with White Noise?", "fi": "Jaetaanko ryhmien diagnostiikkalokit White Noiselle?", "ctx": ["Android strings: audit_upload_confirm_title"], "tag": "", "shot": null}, {"id": "3242", "en": "Group diagnostic logs from all profiles here upload to the White Noise audit collector, run by the Internet Privacy Foundation. Logs already stored may upload too. They can include group and message IDs, relay addresses, timestamps, pseudonymous account references, an installation ID, device model and app version, never message contents or private keys. They’re sensitive, used to investigate reliability, and separate from usage sharing. Turning off stops new recording and uploads; one in progress may finish. Existing logs, here or uploaded, stay. Cancel keeps sharing off.", "fi": "Kaikkien tämän laitteen profiilien ryhmien diagnostiikkalokit lähetetään White Noisen audit-keräimeen, jota ylläpitää Internet Privacy Foundation. Myös jo tallennettuja lokeja voidaan lähettää. Ne voivat sisältää ryhmien ja viestien tunnuksia, releiden osoitteita, aikaleimoja, pseudonyymejä tiliviittauksia, asennustunnuksen, laitemallin ja sovellusversion, mutta eivät koskaan viestien sisältöä tai yksityisiä avaimia. Lokit ovat arkaluonteisia, niitä käytetään luotettavuuden selvittämiseen, ja ne ovat erillään käyttötietojen jakamisesta. Poistaminen käytöstä lopettaa uuden tallennuksen ja lähetykset. Käynnissä oleva lähetys voi vielä valmistua. Olemassa olevat lokit, täällä tai lähetetyt, säilyvät. Peruuta pitää jakamisen pois päältä.", "ctx": ["Android strings: audit_upload_disclosure"], "tag": "", "shot": null}, {"id": "3243", "en": "Enable automatic sharing", "fi": "Ota automaattinen jakaminen käyttöön", "ctx": ["Android strings: audit_upload_confirm"], "tag": "", "shot": null}, {"id": "3244", "en": "Sharing details changed. Review them before turning logs back on.", "fi": "Jakamisen ehdot ovat muuttuneet. Tarkista ne ennen kuin otat lokit uudelleen käyttöön.", "ctx": ["Android strings: audit_upload_renew"], "tag": "", "shot": null}, {"id": "3245", "en": "Used to investigate reliability. Members appear as hashed references; logs carry technical IDs and timestamped membership changes. Never message contents, profile or group names, or private keys.", "fi": "Käytetään luotettavuuden selvittämiseen. Jäsenet näkyvät tiivisteviittauksina. Lokit sisältävät teknisiä tunnuksia ja aikaleimattuja jäsenyysmuutoksia. Ei koskaan viestien sisältöä, profiilien tai ryhmien nimiä eikä yksityisiä avaimia.", "ctx": ["Android strings: diagnostics_group_disclosure"], "tag": "", "shot": null}, {"id": "3246", "en": "Turning this on may upload logs already on this device.", "fi": "Käyttöönotto voi lähettää lokit, jotka ovat jo tällä laitteella.", "ctx": ["Android strings: diagnostics_existing_logs"], "tag": "", "shot": null}, {"id": "3247", "en": "Our servers delete group logs after 30 days, telemetry after 90 and analytics after 180.", "fi": "Palvelimemme poistavat ryhmälokit 30 päivän, telemetrian 90 päivän ja analytiikan 180 päivän kuluttua.", "ctx": ["Android strings: diagnostics_retention"], "tag": "", "shot": null}, {"id": "3248", "en": "Turning off stops new recording and uploads; one in progress may finish. Existing logs here or on our servers aren’t deleted.", "fi": "Poistaminen käytöstä lopettaa uuden tallennuksen ja lähetykset. Käynnissä oleva lähetys voi vielä valmistua. Olemassa olevia lokeja ei poisteta tältä laitteelta eikä palvelimiltamme.", "ctx": ["Android strings: diagnostics_disable_disclosure"], "tag": "", "shot": null}, {"id": "3249", "en": "Permanently deletes all profiles’ diagnostic logs from this device. Sharing settings don’t change.", "fi": "Poistaa pysyvästi kaikkien profiilien diagnostiikkalokit tältä laitteelta. Jakamisasetukset eivät muutu.", "ctx": ["Android strings: diagnostics_clear_confirm_body"], "tag": "", "shot": null}, {"id": "3250", "en": "Couldn’t open the donation page. Try again.", "fi": "Lahjoitussivua ei voitu avata. Yritä uudelleen.", "ctx": ["Android strings: donate_open_failed"], "tag": "", "shot": null}, {"id": "3251", "en": "Checking invitation…", "fi": "Tarkistetaan kutsua…", "ctx": ["Android strings: checking_invitation"], "tag": "", "shot": null}, {"id": "3252", "en": "Couldn’t check invitation", "fi": "Kutsua ei voitu tarkistaa", "ctx": ["Android strings: couldnt_check_invitation"], "tag": "", "shot": null}, {"id": "3253", "en": "Leave not confirmed. History kept.", "fi": "Poistumista ei vahvistettu. Historia säilytettiin.", "ctx": ["Android strings: toast_leave_not_confirmed_history_kept"], "tag": "", "shot": null}, {"id": "3254", "en": "This does not leave the chat.", "fi": "Tämä ei poista sinua keskustelusta.", "ctx": ["Android strings: delete_local_does_not_leave"], "tag": "", "shot": null}, {"id": "3255", "en": "Share usage", "fi": "Jaa käyttötiedot", "ctx": ["Android strings: onboarding_share_usage_title"], "tag": "", "shot": null}, {"id": "3256", "en": "Feature use and app performance.", "fi": "Ominaisuuksien käyttö ja sovelluksen suorituskyky.", "ctx": ["Android strings: onboarding_share_usage_summary"], "tag": "", "shot": null}, {"id": "3257", "en": "Share diagnostic logs", "fi": "Jaa diagnostiikkalokit", "ctx": ["Android strings: onboarding_share_logs_title"], lettä. Pyydä häntä tarkistamaan saapuvien viestien releensä White Noisen asetuksista ja yritä sitten uudelleen.", "ctx": ["Android strings: error_missing_member_inbox"], "tag": "", "shot": null}, {"id": "3270", "en": "There is no usable inbox relay for %1$s. Ask them to check their inbox relays in White Noise settings, then retry.", "fi": "Käyttäjällä %1$s ei ole käyttökelpoista saapuvien viestien relettä. Pyydä häntä tarkistamaan saapuvien viestien releensä White Noisen asetuksista ja yritä sitten uudelleen.", "ctx": ["Android strings: error_missing_member_inbox_for"], "tag": "", "shot": null}, {"id": "3271", "en": "This invitation is too large for a recipient’s inbox relays to accept. Ask them to add an inbox relay that accepts larger messages.", "fi": "Tämä kutsu on liian suuri vastaanottajan saapuvien viestien releille. Pyydä häntä lisäämään saapuvien viestien rele, joka hyväksyy suurempia viestejä.", "ctx": ["Android strings: error_invite_welcome_too_large"], "tag": "", "shot": null}, {"id": "3272", "en": "This update is too large for your relays. Nothing was changed.", "fi": "Tämä päivitys on liian suuri releillesi. Mitään ei muutettu.", "ctx": ["Android strings: error_update_too_large"], "tag": "", "shot": null}, {"id": "3273", "en": "A group change was too large for the group’s relays, so it wasn’t made.", "fi": "Ryhmän muutos oli liian suuri ryhmän releille, joten sitä ei tehty.", "ctx": ["Android strings: error_group_change_too_large"], "tag": "", "shot": null}, {"id": "3274", "en": "Notification previews", "fi": "Näytä ilmoitusten esikatselu", "ctx": ["Android strings: notification_show_previews"], "tag": "", "shot": null}, {"id": "3275", "en": "Choose what notifications show. Applies to all accounts.", "fi": "Kun pois, nimet ja viestien sisältö piilotetaan. Koskee kaikkia tilejä.", "ctx": ["Android strings: notification_show_previews_detail"], "tag": "", "shot": null}, {"id": "3276", "en": "Name and message", "fi": "Nimi ja viesti", "ctx": ["Android strings: notification_preview_full"], "tag": "", "shot": null}, {"id": "3277", "en": "Shows the sender and message text", "fi": "Näyttää lähettäjän ja viestin tekstin", "ctx": ["Android strings: notification_preview_full_detail"], "tag": "", "shot": null}, {"id": "3278", "en": "Name only", "fi": "Vain nimi", "ctx": ["Android strings: notification_preview_name_only"], "tag": "", "shot": null}, {"id": "3279", "en": "Shows the sender, hides the message", "fi": "Näyttää lähettäjän, piilottaa viestin", "ctx": ["Android strings: notification_preview_name_only_detail"], "tag": "", "shot": null}, {"id": "3280", "en": "Hidden", "fi": "Piilotettu", "ctx": ["Android strings: notification_preview_none"], "tag": "", "shot": null}, {"id": "3281", "en": "Shows only that something arrived", "fi": "Näyttää vain, että jotain saapui", "ctx": ["Android strings: notification_preview_none_detail"], "tag": "", "shot": null}, {"id": "3282", "en": "Changes may be lost after restarting.", "fi": "Muutokset voivat kadota uudelleenkäynnistyksen jälkeen.", "ctx": ["Android strings: notification_preview_update_failed"], "tag": "", "shot": null}, {"id": "3283", "en": "Loading profile…", "fi": "Ladataan profiilia…", "ctx": ["Android strings: profile_readiness_loading"], "tag": "", "shot": null}, {"id": "3284", "en": "Profile status unavailable · Tap to edit", "fi": "Profiilin tila ei saatavilla · Muokkaa napauttamalla", "ctx": ["Android strings: profile_readiness_unavailable"], "tag": "", "shot": null}, {"id": "3285", "en": "Profile status unavailable", "fi": "Profiilin tila ei saatavilla", "ctx": ["Android strings: profile_readiness_editor_unavailable"], "tag": "", "shot": null}, {"id": "3286", "en": "Set up your profile", "fi": "Määritä profiilisi", "ctx": ["Android strings: profile_readiness_setup"], "tag": "", "shot": null}, {"id": "3287", "en": "Profile ready", "fi": "Profiili valmis", "ctx": ["Android strings: profile_readiness_ready"], "tag": "", "shot": null}, {"id": "3288", "en": "Profile ready · Optional details available", "fi": "Profiili valmis · Valinnaisia tietoja saatavilla", "ctx": ["Android strings: profile_readiness_optional"], "tag": "", "shot": null}, {"id": "3289", "en": "Bio", "fi": "Tietoja", "ctx": ["Android strings: profile_readiness_bio"], "tag": "", "shot": null}, {"id": "3290", "en": "Banner", "fi": "Kansikuva", "ctx": ["Android strings: profile_readiness_banner"], "tag": "", "shot": null}, {"id": "3291", "en": "Added", "fi": "Lisätty", "ctx": ["Android strings: profile_readiness_added"], "tag": "", "shot": null}, {"id": "3292", "en": "Recommended", "fi": "Suositeltu", "ctx": ["Android strings: profile_readiness_recommended"], "tag": "", "shot": null}, {"id": "3293", "en": "Claude Code CLI coding agent", "fi": "Claude Code CLI -koodausagentti", "ctx": ["Android strings: agent_connector_claude_subtitle"], "tag": "", "shot": null}, {"id": "3294", "en": "Installation prompt for connecting Claude Code to White Noise through Marmot. Paste this into Claude Code in a terminal on the computer where the agent will run. The Claude mobile app and its cloud sessions cannot install the connector on that computer. Read the authoritative Claude Code harness guide at https://github.com/marmot-protocol/mdk/blob/master/integrations/claude/marmot/README.md and the evergreen connector guide at https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md. Explain to me how the connector works and what the installation will change. Confirm prerequisites: Claude Code CLI is installed, authenticated, and available on PATH. If anything is missing, use https://code.claude.com/docs/en/setup to explain the required installation, PATH or sign-in steps and ask for my approval before any host changes, including installing Claude Code or changing PATH or sign-in setup. Ask me to check on my phone that its public relay list contains wss://relay.eu.whitenoise.chat and wss://relay.us.whitenoise.chat; do not claim to verify phone settings from this computer. Then propose the installation steps for my public npub: %1$s, and ask for my approval before making any changes. Once I approve, use the checksum-verified install-claude-marmot.sh release flow, bootstrap wn-agent with that npub as the only allowed welcomer, and verify wn-claude --version. Explain that the downloaded installer runs with bash install-claude-marmot.sh. Then reply with your agent npub and ask me to invite it from White Noise. In the invited group, my first message should select an existing folder relative to the agent computer’s home: /Claude selects $HOME/Claude, not /Users/me/Claude. Then ask me to send a test message from this allowed npub over the configured relays. Do not report setup complete until wn-claude returns a reply through White Noise; if that round trip cannot be verified automatically, mark device verification required.", "fi": "Tämä on asennuskehote, jolla Claude Code yhdistetään White Noiseen Marmotin kautta. Liitä tämä Claude Codeen päätteessä sillä tietokoneella, jolla agentti tulee toimimaan. Claude-mobiilisovellus ja sen pilvi-istunnot eivät voi asentaa connectoria kyseiselle tietokoneelle. Lue ensisijainen Claude Code -harness-opas osoitteessa https://github.com/marmot-protocol/mdk/blob/master/integrations/claude/marmot/README.md ja ajantasainen connector-opas osoitteessa https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md. Selitä minulle, miten connector toimii ja mitä asennus muuttaa. Varmista edellytykset: Claude Code CLI on asennettu, todennettu ja käytettävissä PATH-muuttujassa. Jos jotain puuttuu, selitä tarvittavat asennus-, PATH- tai kirjautumisvaiheet sivun https://code.claude.com/docs/en/setup avulla ja pyydä hyväksyntääni ennen kuin teet koneelle muutoksia, myös ennen Claude Coden asentamista tai PATH- tai kirjautumisasetusten muuttamista. Pyydä minua tarkistamaan puhelimesta, että sen julkinen releluettelo sisältää osoitteet wss://relay.eu.whitenoise.chat ja wss://relay.us.whitenoise.chat. Älä väitä tarkistavasi puhelimen asetuksia tältä tietokoneelta. Ehdota sitten asennusvaiheita julkiselle npubilleni: %1$s, ja pyydä hyväksyntääni ennen kuin teet muutoksia. Kun olen hyväksynyt, käytä tarkistussummalla varmennettua install-claude-marmot.sh-julkaisuprosessia, alusta wn-agent niin, että tämä npub on ainoa sallittu welcomer, ja varmista wn-claude --version. Kerro, että ladattu asennusohjelma ajetaan komennolla bash install-claude-marmot.sh. Vastaa sitten agenttisi npubilla ja pyydä minua kutsumaan se White Noisesta. Kutsutussa ryhmässä ensimmäisen viestini pitää valita olemassa oleva kansio suhteessa agentin tietokoneen kotikansioon: /Claude valitsee $HOME/Claude, ei /Users/me/Claude. Pyydä sitten minua lähettämään testiviesti tästä sallitusta npubista määritettyjen releiden kautta. Älä ilmoita käyttöönottoa valmiiksi ennen kuin wn-claude vastaa White Noisen kautta. Jos tätä edestakaista viestiä ei voi varmentaa automaattisesti, merkitse, että laitteella varmentaminen tarvitaan.", "ctx": ["Android strings: agent_connector_claude_prompt"], "tag": "", "shot": null}, {"id": "3295", "en": "Tip: use a separate group for each project.", "fi": "Vinkki: käytä jokaiselle projektille omaa ryhmää.", "ctx": ["Android strings: ai_agents_project_groups_tip"], "tag": "", "shot": null}, {"id": "3296", "en": "View image", "fi": "Näytä kuva", "ctx": ["Android strings: nostr_event_view_image"], "tag": "", "shot": null}, {"id": "3297", "en": "Couldn’t load this image. Try again.", "fi": "Kuvaa ei voitu ladata. Yritä uudelleen.", "ctx": ["Android strings: nostr_event_image_failed"], "tag": "", "shot": null}, {"id": "3298", "en": "View full event", "fi": "Näytä koko tapahtuma", "ctx": ["Android strings: nostr_event_expand"], "tag": "", "shot": null}, {"id": "3299", "en": "Checking availability", "fi": "Tarkistetaan saatavuutta", "ctx": ["Android strings: floating_attachment_resolving"], "tag": "", "shot": null}, {"id": "3300", "en": "Available on this device",
