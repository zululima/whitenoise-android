ll}, {"id": "1058", "en": "Adds a person by public key, in npub or hex form. The key is checked first, and you see a message if it is not valid.", "fi": "Lisää henkilön julkisen avaimen perusteella npub- tai hex-muodossa. Avain tarkistetaan ensin, ja näet viestin, jos se ei ole kelvollinen.", "ctx": ["Android explanation_organize_strings: explanation_organize_cond_add_key"], "tag": "", "shot": null}, {"id": "1059", "en": "Shows or hides extra options for this condition, such as excluding the chats it matches.", "fi": "Näyttää tai piilottaa tämän ehdon lisäasetukset, kuten sitä vastaavien keskustelujen poisjättämisen.", "ctx": ["Android explanation_organize_strings: explanation_organize_cond_options"], "tag": "", "shot": null}, {"id": "1060", "en": "Chooses whether chats matching this condition are included or excluded. Exclude means the folder shows chats that do not match.", "fi": "Valitsee, sisällytetäänkö tätä ehtoa vastaavat keskustelut vai jätetäänkö ne pois. Poisjättäminen tarkoittaa, että kansio näyttää keskustelut, jotka eivät vastaa ehtoa.", "ctx": ["Android explanation_organize_strings: explanation_organize_cond_not"], "tag": "", "shot": null}, {"id": "1061", "en": "Removes this condition from the folder draft. The change applies when you save the folder.", "fi": "Poistaa tämän ehdon kansion luonnoksesta. Muutos tulee voimaan, kun tallennat kansion.", "ctx": ["Android explanation_organize_strings: explanation_organize_cond_remove"], "tag": "", "shot": null}, {"id": "1062", "en": "Replaces the automatic rules with a ready-made set that shows chats that have no unread messages. Unread chats stay out of the folder. Note that read does not mean an agent has finished.", "fi": "Korvaa automaattiset säännöt valmiilla joukolla, joka näyttää keskustelut, joissa ei ole lukemattomia viestejä. Lukemattomat keskustelut pysyvät poissa kansiosta. Huomaa, että luettu ei tarkoita, että agentti olisi valmis.", "ctx": ["Android explanation_organize_strings: explanation_organize_preset_read"], "tag": "", "shot": null}, {"id": "1063", "en": "Replaces the automatic rules with a ready-made set that shows chats with unread mentions of you.", "fi": "Korvaa automaattiset säännöt valmiilla joukolla, joka näyttää keskustelut, joissa on sinua koskevia lukemattomia mainintoja.", "ctx": ["Android explanation_organize_strings: explanation_organize_preset_mentions"], "tag": "", "shot": null}, {"id": "1064", "en": "Shows or hides the original simple rule switches and people list this folder was saved with, so you can keep editing them.", "fi": "Näyttää tai piilottaa alkuperäiset yksinkertaiset sääntökytkimet ja henkilöluettelon, joilla tämä kansio tallennettiin, jotta voit jatkaa niiden muokkaamista.", "ctx": ["Android explanation_organize_strings: explanation_organize_legacy_edit"], "tag": "", "shot": null}, {"id": "1065", "en": "Opens a short list of ready-made rule sets that replace the current automatic rules after you confirm.", "fi": "Avaa lyhyen luettelon valmiista sääntöjoukoista, jotka korvaavat nykyiset automaattiset säännöt vahvistuksesi jälkeen.", "ctx": ["Android explanation_organize_strings: explanation_organize_presets_menu"], "tag": "", "shot": null}, {"id": "1066", "en": "Replaces the unsupported or invalid rules with the standard setup, which skips archived chats and only includes chats you have joined.", "fi": "Korvaa tukemattomat tai virheelliset säännöt vakioasetuksilla, jotka ohittavat arkistoidut keskustelut ja sisältävät vain keskustelut, joihin olet liittynyt.", "ctx": ["Android explanation_organize_strings: explanation_organize_reset_filters"], "tag": "", "shot": null}, {"id": "1067", "en": "Replaces your current automatic rules with the new ones. The folder name and manually included chats stay as they are, and the change applies when you save the folder.", "fi": "Korvaa nykyiset automaattiset sääntösi uusilla. Kansion nimi ja käsin lisätyt keskustelut pysyvät ennallaan, ja muutos tulee voimaan, kun tallennat kansion.", "ctx": ["Android explanation_organize_strings: explanation_organize_replace_rules"], "tag": "", "shot": null}, {"id": "1068", "en": "Opens the profile settings for the active account, such as your name, picture and about text. The line under the title shows how complete your profile is. Changes apply to this profile only.", "fi": "Avaa aktiivisen tilin profiiliasetukset, kuten nimesi, kuvasi ja esittelytekstisi. Otsikon alla oleva rivi kertoo, kuinka valmis profiilisi on. Muutokset koskevat vain tätä profiilia.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_profile"], "tag": "", "shot": null}, {"id": "1069", "en": "Opens the keys for this profile. You can view the public key to share and manage the private key that proves the profile is yours. Keep the private key safe, because anyone who has it can act as you.", "fi": "Avaa tämän profiilin avaimet. Voit katsoa jaettavaa julkista avainta ja hallita yksityistä avainta, joka todistaa profiilin olevan sinun. Pidä yksityinen avain turvassa, koska kuka tahansa, jolla se on, voi toimia sinuna.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_profile_keys"], "tag": "", "shot": null}, {"id": "1070", "en": "Opens your chat folders. Folders sort your chats into tabs, either by choosing chats yourself or by rules such as unread or mentions. You can add, edit, reorder and delete folders here.", "fi": "Avaa keskustelukansiosi. Kansiot lajittelevat keskustelusi välilehdille joko itse valitsemiesi keskustelujen tai sääntöjen, kuten lukemattomien tai mainintojen, perusteella. Täällä voit lisätä, muokata, järjestää ja poistaa kansioita.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_chat_folders"], "tag": "", "shot": null}, {"id": "1071", "en": "Opens the swipe action settings. You choose what happens when you swipe a chat in your chat list. The choices apply on this device.", "fi": "Avaa pyyhkäisytoimintojen asetukset. Valitset, mitä tapahtuu, kun pyyhkäiset keskustelua keskusteluluettelossasi. Valinnat koskevat tätä laitetta.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_gestures"], "tag": "", "shot": null}, {"id": "1072", "en": "Opens the message box settings. You can change the shortcuts, their order and the layout of the controls around the box where you write messages.", "fi": "Avaa viestikentän asetukset. Voit muuttaa pikatoimintoja, niiden järjestystä ja säätimien asettelua kentän ympärillä, jossa kirjoitat viestejä.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_composer"], "tag": "", "shot": null}, {"id": "1073", "en": "Lets you choose what the Enter key does when you write a message: send it or start a new line. Shift+Enter on a hardware keyboard always adds a new line. The current choice is shown on the right.", "fi": "Voit valita, mitä Enter-näppäin tekee, kun kirjoitat viestiä: lähettää viestin vai aloittaa uuden rivin. Vaihto+Enter lisää fyysisellä näppäimistöllä aina uuden rivin. Nykyinen valinta näkyy oikealla.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_enter_behavior"], "tag": "", "shot": null}, {"id": "1074", "en": "Opens your custom emoji. These are extra emoji pictures you can add and use in messages, alongside the standard emoji sets.", "fi": "Avaa omat emojisi. Ne ovat lisäemojikuvia, joita voit lisätä ja käyttää viesteissä tavallisten emojisarjojen rinnalla.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_custom_emoji"], "tag": "", "shot": null}, {"id": "1075", "en": "Shows your other accounts beside your avatar so you can switch with one tap. Turn it off to hide them. This changes only how switching looks and does not remove any account.", "fi": "Näyttää muut tilisi avatarisi vieressä, jotta voit vaihtaa tiliä yhdellä napautuksella. Poista asetus käytöstä piilottaaksesi ne. Tämä muuttaa vain vaihtamisen ulkoasua eikä poista yhtään tiliä.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_quick_switching"], "tag": "", "shot": null}, {"id": "1076", "en": "Opens the language settings. The language shown on the right is the one the app uses for its menus and text. You can follow the language of your device or pick another.", "fi": "Avaa kieliasetukset. Oikealla näkyvä kieli on se, jota sovellus käyttää valikoissaan ja teksteissään. Voit seurata laitteesi kieltä tai valita toisen.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_language"], "tag": "", "shot": null}, {"id": "1077", "en": "Opens the read-aloud settings. These control how the app speaks messages and alerts out loud, such as the voice and speed.", "fi": "Avaa ääneen lukemisen asetukset. Ne määrittävät, miten sovellus lukee viestit ja ilmoitukset ääneen, esimerkiksi äänen ja nopeuden.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_read_aloud"], "tag": "", "shot": null}, {"id": "1078", "en": "Opens the dictation settings. Dictation turns your speech into text in the message box, and you choose which speech provider does that here.", "fi": "Avaa saneluasetukset. Sanelu muuttaa puheesi tekstiksi viestikentässä, ja täällä valitset, mikä puhepalvelu sen tekee.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_dictation"], "tag": "", "shot": null}, {"id": "1079", "en": "Opens the translation settings. You choose how messages are translated into the language you read.", "fi": "Avaa käännösasetukset. Valitset, miten viestit käännetään kielelle, jolla luet.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_translation"], "tag": "", "shot": null}, {"id": "1080", "en": "Opens the help pages, with guides about using the app and information about it.", "fi": "Avaa ohjesivut, joilla on oppaita sovelluksen käytöstä ja tietoja siitä.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_help"], "tag": "", "shot": null}, {"id": "1081", "en": "Opens a way to start a chat with the support team from your active account. Starting a new support chat needs a receiving relay (a server that delivers messages to you).", "fi": "Avaa tavan aloittaa keskustelu tukitiimin kanssa aktiiviselta tililtäsi. Uuden tukikeskustelun aloittaminen vaatii vastaanottavan releen (palvelimen, joka toimittaa viestit sinulle).", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_support"], "tag": "", "shot": null}, {"id": "1082", "en": "Opens the donation page. Donating is optional and helps fund the development of the app.", "fi": "Avaa lahjoitussivun. Lahjoittaminen on vapaaehtoista ja auttaa rahoittamaan sovelluksen kehitystä.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_donate"], "tag": "", "shot": null}, {"id": "1083", "en": "Opens tools meant for developers and testing, such as key package and diagnostic screens. You do not need these for everyday use.", "fi": "Avaa kehittäjille ja testaukseen tarkoitetut työkalut, kuten avainpaketti- ja diagnostiikkanäkymät. Et tarvitse niitä tavallisessa käytössä.", "ctx": ["Android explanation_organize_strings: explanation_organize_hub_developer"], "tag": "", "shot": null}, {"id": "1084", "en": "Searches your relays (servers that pass messages along) for emoji sets that match what you typed. If you pasted a set link, it opens that set directly. Nothing is installed until you choose to install a set.", "fi": "Hakee releistäsi (palvelimista, jotka välittävät viestejä) emojisarjoja, jotka vastaavat kirjoittamaasi. Jos liitit sarjan linkin, se avaa sarjan suoraan. Mitään ei asenneta ennen kuin päätät asentaa sarjan.", "ctx": ["Android explanation_organize_strings: explanation_organize_emoji_find"], "tag": "", "shot": null}, {"id": "1085", "en": "Opens a preview of this emoji set so you can look it over before installing it. The line under the name shows how many emoji it has, or whether it is installed or has an update.", "fi": "Avaa tämän emojisarjan esikatselun, jotta voit tutustua siihen ennen asentamista. Nimen alla oleva rivi kertoo, montako emojia sarjassa on tai onko se asennettu tai onko siihen päivitys.", "ctx": ["Android explanation_organize_strings: explanation_organize_emoji_set"], "tag": "", "shot": null}, {"id": "1086", "en": "Loads the preview picture for this set from the server that hosts it. This shares your IP address with that image host. Without it, the set is shown as text only.", "fi": "Lataa tämän sarjan esikatselukuvan sitä ylläpitävältä palvelimelta. Tämä jakaa IP-osoitteesi kyseiselle kuvapalvelimelle. Ilman sitä sarja näytetään pelkkänä tekstinä.", "ctx": ["Android explanation_organize_strings: explanation_organize_emoji_load_image"], "tag": "", "shot": null}, {"id": "1087", "en": "Installs this set so its emoji are available to use in messages. Installing downloads the images, which shares your IP address with their image hosts. You can cancel while it runs and remove the set later.", "fi": "Asentaa tämän sarjan, jotta sen emojeja voi käyttää viesteissä. Asennus lataa kuvat, mikä jakaa IP-osoitteesi niiden kuvapalvelimille. Voit peruuttaa asennuksen sen aikana ja poistaa sarjan myöhemmin.", "ctx": ["Android explanation_organize_strings: explanation_organize_emoji_install"], "tag": "", "shot": null}, {"id": "1088", "en": "Replaces your installed copy with the newer version of this set. Updating downloads the images again, which shares your IP address with their image hosts.", "fi": "Korvaa asennetun kopiosi tämän sarjan uudemmalla versiolla. Päivitys lataa kuvat uudelleen, mikä jakaa IP-osoitteesi niiden kuvapalvelimille.", "ctx": ["Android explanation_organize_strings: explanation_organize_emoji_update"], "tag": "", "shot": null}, {"id": "1089", "en": "Looks again for a newer version of this installed set. If one is found, an update button appears. Your installed set does not change until you update it.", "fi": "Etsii uudelleen tämän asennetun sarjan uudempaa versiota. Jos sellainen löytyy, päivityspainike tulee näkyviin. Asennettu sarja ei muutu ennen kuin päivität sen.", "ctx": ["Android explanation_organize_strings: explanation_organize_emoji_check_update"], "tag": "", "shot": null}, {"id": "1090", "en": "Removes this set from your installed emoji sets, so its emoji are no longer offered for you to use. You can find and install the set again later.", "fi": "Poistaa tämän sarjan asennetuista emojisarjoistasi, joten sen emojeja ei enää tarjota käytettäväksesi. Voit löytää ja asentaa sarjan myöhemmin uudelleen.", "ctx": ["Android explanation_organize_strings: explanation_organize_emoji_remove"], "tag": "", "shot": null}, {"id": "1091", "en": "Stops the install that is running. The set is not installed, and you can start the install again later.", "fi": "Pysäyttää käynnissä olevan asennuksen. Sarjaa ei asenneta, ja voit aloittaa asennuksen myöhemmin uudelleen.", "ctx": ["Android explanation_organize_strings: explanation_organize_emoji_cancel"], "tag": "", "shot": null}, {"id": "1092", "en": "Opens a confirmation to remove this custom emoji from this device. Messages you already sent keep their copy of the image. Emoji marked display only cannot be sent, but you can still remove them.", "fi": "Avaa vahvistuksen tämän oman emojin poistamiseksi tältä laitteelta. Jo lähettämäsi viestit säilyttävät oman kopionsa kuvasta. Vain näytettäviksi merkittyjä emojeja ei voi lähettää, mutta voit silti poistaa ne.", "ctx": ["Android explanation_organize_strings: explanation_organize_custom_emoji_entry"], "tag": "", "shot": null}, {"id": "1093", "en": "Lets you pick an image from your photos to turn into a custom emoji. You then give it a shortcode name, and it is stored on this device. Images must be PNG, GIF, WebP or JPEG and no larger than 1 MB.", "fi": "Voit valita kuvistasi kuvan, josta tehdään oma emoji. Annat sille sitten lyhytkoodinimen, ja se tallennetaan tälle laitteelle. Kuvien on oltava PNG-, GIF-, WebP- tai JPEG-muodossa ja enintään 1 Mt.", "ctx": ["Android explanation_organize_strings: explanation_organize_custom_emoji_photos"], "tag": "", "shot": null}, {"id": "1094", "en": "Lets you pick an image file to turn into a custom emoji. You then give it a shortcode name, and it is stored on this device. Images must be PNG, GIF, WebP or JPEG and no larger than 1 MB.", "fi": "Voit valita kuvatiedoston, josta tehdään oma emoji. Annat sille sitten lyhytkoodinimen, ja se tallennetaan tälle laitteelle. Kuvien on oltava PNG-, GIF-, WebP- tai JPEG-muodossa ja enintään 1 Mt.", "ctx": ["Android explanation_organize_strings: explanation_organize_custom_emoji_files"], "tag": "", "shot": null}, {"id": "1095", "en": "Opens the emoji set browser, where you can find shared emoji sets on your relays (servers that pass messages along) or paste a set link, preview a set and install it for this profile.", "fi": "Avaa emojisarjojen selaimen, jossa voit etsiä jaettuja emojisarjoja releistäsi (palvelimista, jotka välittävät viestejä) tai liittää sarjan linkin, esikatsella sarjaa ja asentaa sen tälle profiilille.", "ctx": ["Android explanation_organize_strings: explanation_organize_custom_emoji_sets"], "tag": "", "shot": null}, {"id": "1096", "en": "Opens the bug report page. It explains what is and is not shared before you continue to GitHub, where you write the report yourself.", "fi": "Avaa virheraporttisivun. Se kertoo, mitä jaetaan ja mitä ei, ennen kuin jatkat GitHubiin, jossa kirjoitat raportin itse.", "ctx": ["Android explanation_organize_strings: explanation_organize_help_bug_report"], "tag": "", "shot": null}, {"id": "1097", "en": "Opens the app version, the open source licenses and the privacy policy.", "fi": "Avaa sovelluksen version, avoimen lähdekoodin lisenssit ja tietosuojakäytännön.", "ctx": ["Android explanation_organize_strings: explanation_organize_help_about"], "tag": "", "shot": null}, {"id": "1098", "en": "Opens the public White Noise Android issue form in your browser. The app attaches nothing to it: no messages, media, contacts, profile details, keys or logs. GitHub issues are public, so check what you write before you send it.", "fi": "Avaa White Noisen Android-sovelluksen julkisen virhelomakkeen selaimessasi. Sovellus ei liitä siihen mitään: ei viestejä, mediaa, yhteystietoja, profiilitietoja, avaimia eikä lokeja. GitHubin issuet ovat julkisia, joten tarkista kirjoittamasi ennen lähettämistä.", "ctx": ["Android explanation_organize_strings: explanation_organize_help_open_github"], "tag": "", "shot": null}, {"id": "1099", "en": "Opens the developer tools. They are meant for testing and troubleshooting, and they appear here because developer mode is on.", "fi": "Avaa kehittäjätyökalut. Ne on tarkoitettu testaukseen ja vianmääritykseen, ja ne näkyvät tässä, koska kehittäjätila on päällä.", "ctx": ["Android explanation_organize_strings: explanation_organize_help_developer"], "tag": "", "shot": null}, {"id": "1100", "en": "Opens the list of open source software that White Noise includes, with each project's license notice. It is shown inside the app.", "fi": "Avaa luettelon White Noisen sisältämistä avoimen lähdekoodin ohjelmistoista ja kunkin projektin lisenssitiedotteen. Se näytetään sovelluksen sisällä.", "ctx": ["Android explanation_organize_strings: explanation_organize_help_licenses"], "tag": "", "shot": null}, {"id": "1101", "en": "Opens the White Noise privacy policy in your browser. It describes how the app handles your data.", "fi": "Avaa White Noisen tietosuojakäytännön selaimessasi. Se kertoo, miten sovellus käsittelee tietojasi.", "ctx": ["Android explanation_organize_strings: explanation_organize_help_privacy"], "tag": "", "shot": null}, {"id": "1102", "en": "Opens your relay settings. Relays are servers that pass messages along, and support needs at least one receiving relay so replies can reach you. Review them here, then come back to start the chat.", "fi": "Avaa releidesi asetukset. Releet ovat palvelimia, jotka välittävät viestejä, ja tuki tarvitsee vähintään yhden vastaanottavan releen, jotta vastaukset tavoittavat sinut. Tarkista ne täällä ja palaa sitten aloittamaan keskustelu.", "ctx": ["Android explanation_organize_strings: explanation_organize_support_relays"], "tag": "", "shot": null}, {"id": "1103", "en": "Checks your relay setup again after it could not be read. If a receiving relay is found, you can start the support chat.", "fi": "Tarkistaa releidesi asetukset uudelleen, kun niitä ei voitu lukea. Jos vastaanottava rele löytyy, voit aloittaa tukikeskustelun.", "ctx": ["Android explanation_organize_strings: explanation_organize_support_retry"], "tag": "", "shot": null}, {"id": "1104", "en": "Starts a chat with support from your active account, or opens the one you already have. If you have no support chat yet, it first shows the support profile for you to review. It is unavailable until a receiving relay is set up.", "fi": "Aloittaa keskustelun tuen kanssa aktiiviselta tililtäsi tai avaa jo olemassa olevan. Jos sinulla ei vielä ole tukikeskustelua, se näyttää ensin tuen profiilin tarkistettavaksesi. Se ei ole käytettävissä, ennen kuin vastaanottava rele on määritetty.", "ctx": ["Android explanation_organize_strings: explanation_organize_support_start"], "tag": "", "shot": null}, {"id": "1105", "en": "Opens the license notice for this piece of software. You can select and copy the text. Go back to return to the list.", "fi": "Avaa tämän ohjelmiston lisenssitiedotteen. Voit valita ja kopioida tekstin. Palaa luetteloon menemällä takaisin.", "ctx": ["Android explanation_organize_strings: explanation_organize_license_notice"], "tag": "", "shot": null}, {"id": "1106", "en": "Opens the donation page in your browser. Donating is optional, and nothing in the app depends on it. The app does not send any of your data to the page.", "fi": "Avaa lahjoitussivun selaimessasi. Lahjoittaminen on vapaaehtoista, eikä mikään sovelluksessa riipu siitä. Sovellus ei lähetä sivulle mitään tietojasi.", "ctx": ["Android explanation_organize_strings: explanation_organize_donate_open"], "tag": "", "shot": null}, {"id": "1107", "en": "Opens a menu with ways to send your profile to someone: a link, a profile card image, or saving the card to your gallery. Nothing is shared until you pick one.", "fi": "Avaa valikon, jossa on tapoja lähettää profiilisi jollekulle: linkki, profiilikortin kuva tai kortin tallentaminen galleriaan. Mitään ei jaeta ennen kuin valitset jonkin.", "ctx": ["Android explanation_organize_strings: explanation_organize_share_menu"], "tag": "", "shot": null}, {"id": "1108", "en": "Opens the share sheet with a link to your profile. Whoever opens it can find and connect with you. It contains your public key only, never your private key.", "fi": "Avaa jakovalikon, jossa on linkki profiiliisi. Kuka tahansa sen avaava voi löytää sinut ja ottaa sinuun yhteyttä. Se sisältää vain julkisen avaimesi, ei koskaan yksityistä avaintasi.", "ctx": ["Android explanation_organize_strings: explanation_organize_share_url"], "tag": "", "shot": null}, {"id": "1109", "en": "Creates an image of your profile card with its QR code and opens the share sheet so you can send it through an app you choose. It shows only your public profile information.", "fi": "Luo kuvan profiilikortistasi QR-koodeineen ja avaa jakovalikon, jotta voit lähettää sen valitsemallasi sovelluksella. Se näyttää vain julkiset profiilitietosi.", "ctx": ["Android explanation_organize_strings: explanation_organize_share_card"], "tag": "", "shot": null}, {"id": "1110", "en": "Saves the image of your profile card, with its QR code, to your photo gallery on this device. It is unavailable while another export is running or when saving is not supported.", "fi": "Tallentaa profiilikorttisi kuvan QR-koodeineen tämän laitteen kuvagalleriaan. Se ei ole käytettävissä, kun toinen vienti on käynnissä tai kun tallennusta ei tueta.", "ctx": ["Android explanation_organize_strings: explanation_organize_share_gallery"], "tag": "", "shot": null}, {"id": "1111", "en": "Opens the camera to scan another person's profile QR code, so you can connect with them. Camera access is only used while the scanner is open.", "fi": "Avaa kameran toisen henkilön profiilin QR-koodin skannaamiseksi, jotta voit ottaa häneen yhteyttä. Kameraa käytetään vain, kun skanneri on auki.", "ctx": ["Android explanation_organize_strings: explanation_organize_share_scan"], "tag": "", "shot": null}, {"id": "1112", "en": "Copies your public key to the clipboard. Your public key is the address other people use to find and connect with you, so it is safe to share. It never includes your private key.", "fi": "Kopioi julkisen avaimesi leikepöydälle. Julkinen avaimesi on osoite, jolla muut löytävät sinut ja ottavat sinuun yhteyttä, joten sen jakaminen on turvallista. Se ei koskaan sisällä yksityistä avaintasi.", "ctx": ["Android explanation_organize_strings: explanation_organize_copy_public_key"], "tag": "", "shot": null}, {"id": "1113", "en": "Shows a ready-made setup prompt for this AI agent. You review it first, and nothing is copied until you choose to. The prompt contains only your public key.", "fi": "Näyttää valmiin käyttöönottokehotteen tälle tekoälyagentille. Tarkistat sen ensin, eikä mitään kopioida ennen kuin päätät niin. Kehote sisältää vain julkisen avaimesi.", "ctx": ["Android explanation_organize_strings: explanation_organize_ai_connector"], "tag": "", "shot": null}, {"id": "1114", "en": "Copies your public key so you can give it to an agent or tool by hand. It is public information and never includes your private key. It is unavailable if no public key is available.", "fi": "Kopioi julkisen avaimesi, jotta voit antaa sen agentille tai työkalulle käsin. Se on julkista tietoa eikä koskaan sisällä yksityistä avaintasi. Se ei ole käytettävissä, jos julkista avainta ei ole saatavilla.", "ctx": ["Android explanation_organize_strings: explanation_organize_ai_copy_public_key"], "tag": "", "shot": null}, {"id": "1115", "en": "Opens the agent connector documentation in your browser. If no browser can open it, the screen tells you.", "fi": "Avaa agenttien connector-dokumentaation selaimessasi. Jos mikään selain ei voi avata sitä, näkymä kertoo siitä.", "ctx": ["Android explanation_organize_strings: explanation_organize_ai_docs"], "tag": "", "shot": null}, {"id": "1116", "en": "Copies the setup prompt shown above to the clipboard so you can paste it into your agent. It contains only your public key and asks the agent to get your approval before installing. Copying changes nothing in the app.", "fi": "Kopioi yllä näkyvän käyttöönottokehotteen leikepöydälle, jotta voit liittää sen agentillesi. Se sisältää vain julkisen avaimesi ja pyytää agenttia hankkimaan hyväksyntäsi ennen asennusta. Kopioiminen ei muuta sovelluksessa mitään.", "ctx": ["Android explanation_organize_strings: explanation_organize_ai_copy_prompt"], "tag": "", "shot": null}, {"id": "1117", "en": "Turns on extra developer information, such as diagnostics and MLS internals (the encryption protocol used for groups). It changes only what this app shows on this device. Turn it off to hide them again.", "fi": "Ottaa käyttöön kehittäjien lisätiedot, kuten diagnostiikan ja MLS:n sisäiset tiedot (MLS on ryhmien salausprotokolla). Se muuttaa vain sitä, mitä tämä sovellus näyttää tällä laitteella. Poista se käytöstä piilottaaksesi ne taas.", "ctx": ["Android explanation_organize_strings: explanation_organize_dev_mode"], "tag": "", "shot": null}, {"id": "1118", "en": "Opens diagnostics with relay health and MLS internals (the encryption protocol used for groups). It is for troubleshooting and only shows information; it changes no settings.", "fi": "Avaa diagnostiikan, jossa ovat releiden tila ja MLS:n sisäiset tiedot (MLS on ryhmien salausprotokolla). Se on tarkoitettu vianmääritykseen ja vain näyttää tietoja eikä muuta asetuksia.", "ctx": ["Android explanation_organize_strings: explanation_organize_dev_diagnostics"], "tag": "", "shot": null}, {"id": "1119", "en": "Opens a testing tool that sends numbered synthetic messages from this account into a chat you pick. Every member of that chat receives them, so use it only with a private test group.", "fi": "Avaa testityökalun, joka lähettää numeroituja keinotekoisia viestejä tältä tililtä valitsemaasi keskusteluun. Keskustelun kaikki jäsenet saavat ne, joten käytä sitä vain yksityisen testiryhmän kanssa.", "ctx": ["Android explanation_organize_strings: explanation_organize_dev_seed_fixture"], "tag": "", "shot": null}, {"id": "1120", "en": "Chooses this chat as the one that receives the synthetic test messages. Every member of the chat receives them, so pick a private test group. Nothing is sent until you press Start.", "fi": "Valitsee tämän keskustelun vastaanottamaan keinotekoiset testiviestit. Keskustelun kaikki jäsenet saavat ne, joten valitse yksityinen testiryhmä. Mitään ei lähetetä ennen kuin painat Aloita.", "ctx": ["Android explanation_organize_strings: explanation_organize_seed_target"], "tag": "", "shot": null}, {"id": "1121", "en": "Copies your public key to the clipboard. It is the address people use to find and connect with you, so it is safe to share. It never includes your private key.", "fi": "Kopioi julkisen avaimesi leikepöydälle. Se on osoite, jolla ihmiset löytävät sinut ja ottavat sinuun yhteyttä, joten sen jakaminen on turvallista. Se ei koskaan sisällä yksityistä avaintasi.", "ctx": ["Android explanation_organize_strings: explanation_organize_keys_copy_public"], "tag": "", "shot": null}, {"id": "1122", "en": "Sends your private key as plain text to an app you choose in the share sheet. Anyone who gets it controls your profile, so share it only with an app you trust. The encrypted export is safer.", "fi": "Lähettää yksityisen avaimesi pelkkänä tekstinä sovellukselle, jonka valitset jakovalikosta. Kuka tahansa sen saava hallitsee profiiliasi, joten jaa se vain sovellukselle, johon luotat. Salattu vienti on turvallisempi.", "ctx": ["Android explanation_organize_strings: explanation_organize_keys_raw_share"], "tag": "", "shot": null}, {"id": "1123", "en": "Saves your private key to a file as plain text, without a password. Anyone who gets the file controls your profile, so keep it somewhere safe. The encrypted export is safer.", "fi": "Tallentaa yksityisen avaimesi tiedostoon pelkkänä tekstinä ilman salasanaa. Kuka tahansa tiedoston saava hallitsee profiiliasi, joten säilytä se turvallisessa paikassa. Salattu vienti on turvallisempi.", "ctx": ["Android explanation_organize_strings: explanation_organize_keys_raw_file"], "tag": "", "shot": null}, {"id": "1124", "en": "Shows your password-protected backup on screen so you can copy it or export it. It hides again after 30 seconds or when you leave. You need your password to restore from it.", "fi": "Näyttää salasanalla suojatun varmuuskopiosi näytöllä, jotta voit kopioida tai viedä sen. Se piilotetaan taas 30 sekunnin kuluttua tai kun poistut. Tarvitset salasanasi palauttaaksesi siitä.", "ctx": ["Android explanation_organize_strings: explanation_organize_keys_view_backup"], "tag": "", "shot": null}, {"id": "1125", "en": "Saves your password-protected backup to a file you choose. You need the password you just set to open it, so keep the password safe too.", "fi": "Tallentaa salasanalla suojatun varmuuskopiosi valitsemaasi tiedostoon. Tarvitset juuri asettamasi salasanan sen avaamiseen, joten pidä myös salasana turvassa.", "ctx": ["Android explanation_organize_strings: explanation_organize_keys_backup_export"], "tag": "", "shot": null}, {"id": "1126", "en": "Copies the encrypted backup text to the clipboard. It is protected by your password, so it is useless without it. Paste it somewhere safe.", "fi": "Kopioi salatun varmuuskopion tekstin leikepöydälle. Se on suojattu salasanallasi, joten se on hyödytön ilman sitä. Liitä se turvalliseen paikkaan.", "ctx": ["Android explanation_organize_strings: explanation_organize_keys_result_copy"], "tag": "", "shot": null}, {"id": "1127", "en": "Saves the encrypted backup to a file you choose. You need your password to open it later, so keep the password safe too.", "fi": "Tallentaa salatun varmuuskopion valitsemaasi tiedostoon. Tarvitset salasanasi sen avaamiseen myöhemmin, joten pidä myös salasana turvassa.", "ctx": ["Android explanation_organize_strings: explanation_organize_keys_result_export"], "tag": "", "shot": null}, {"id": "1128", "en": "Controls what notifications show. Name and message shows the sender and the text. Name only shows the sender and conversation but hides message text and reaction emoji. Hidden shows neither. This applies to every account on this device, and you can change it back at any time.", "fi": "Määrittää, mitä ilmoitukset näyttävät. Nimi ja viesti näyttää lähettäjän ja tekstin. Vain nimi näyttää lähettäjän ja keskustelun mutta piilottaa viestin tekstin ja reaktioemojit. Piilotettu ei näytä kumpaakaan. Tämä koskee kaikkia tämän laitteen tilejä, ja voit muuttaa sen takaisin milloin tahansa.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_previews"], "tag": "", "shot": null}, {"id": "1129", "en": "Tries again to save your notification preview choice. Until it saves, the change may be lost after you restart the app.", "fi": "Yrittää uudelleen tallentaa ilmoitusten esikatseluvalintasi. Ennen kuin se tallentuu, muutos voi kadota, kun käynnistät sovelluksen uudelleen.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_preview_retry"], "tag": "", "shot": null}, {"id": "1130", "en": "Opens the notification sound and vibration options. You can preview the White Noise tones here and open Android's settings for each category of alert.", "fi": "Avaa ilmoitusten ääni- ja värinävaihtoehdot. Voit kuunnella White Noisen ääniä täällä ja avata Androidin asetukset kullekin ilmoitusluokalle.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_sounds"], "tag": "", "shot": null}, {"id": "1131", "en": "Opens the Android notification permission and battery policy for White Noise. These settings affect whether alerts can reach you while the app is in the background.", "fi": "Avaa White Noisen Android-ilmoituslupa- ja akkukäytäntöasetukset. Nämä asetukset vaikuttavat siihen, tavoittavatko ilmoitukset sinut, kun sovellus on taustalla.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_delivery"], "tag": "", "shot": null}, {"id": "1132", "en": "Opens Android's own notification settings for White Noise. There you can change sounds, importance and which categories can alert you on this device.", "fi": "Avaa Androidin omat ilmoitusasetukset White Noiselle. Niissä voit muuttaa ääniä, tärkeyttä ja sitä, mitkä luokat voivat ilmoittaa sinulle tällä laitteella.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_android_settings"], "tag": "", "shot": null}, {"id": "1133", "en": "Shows whether Android lets White Noise send notifications. Tapping it opens the Android settings where you can change this permission.", "fi": "Näyttää, salliiko Android White Noisen lähettää ilmoituksia. Napauttaminen avaa Androidin asetukset, joissa voit muuttaa tätä lupaa.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_permission"], "tag": "", "shot": null}, {"id": "1134", "en": "Shows how Android's battery policy treats White Noise. Tapping it opens the Android battery settings, where you can change how freely the app may run in the background.", "fi": "Näyttää, miten Androidin akkukäytäntö kohtelee White Noisea. Napauttaminen avaa Androidin akkuasetukset, joissa voit muuttaa sitä, kuinka vapaasti sovellus saa toimia taustalla.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_battery"], "tag": "", "shot": null}, {"id": "1135", "en": "Android is blocking notifications for White Noise. Tapping this opens Android Settings, where you can turn them on again.", "fi": "Android estää White Noisen ilmoitukset. Napauttaminen avaa Androidin asetukset, joissa voit ottaa ne taas käyttöön.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_off"], "tag": "", "shot": null}, {"id": "1136", "en": "Asks Android to let White Noise send notifications. If you decline, you can change your answer later in Android settings.", "fi": "Pyytää Androidia sallimaan White Noisen lähettää ilmoituksia. Jos kieltäydyt, voit muuttaa vastaustasi myöhemmin Androidin asetuksissa.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_allow"], "tag": "", "shot": null}, {"id": "1137", "en": "Opens Android's settings for this category of alerts, where you choose its sound, vibration and importance. The value shown is the sound Android currently uses for it.", "fi": "Avaa Androidin asetukset tälle ilmoitusluokalle. Niissä valitset sen äänen, värinän ja tärkeyden. Näytetty arvo on ääni, jota Android käyttää sille nyt.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_category"], "tag": "", "shot": null}, {"id": "1138", "en": "Plays this White Noise tone so you can hear it, and a second tap stops it. Previewing does not change any alert sound.", "fi": "Toistaa tämän White Noisen ilmoitusäänen, jotta kuulet sen, ja toinen napautus pysäyttää sen. Kuuntelu ei muuta mitään ilmoitusääntä.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_tone_play"], "tag": "", "shot": null}, {"id": "1139", "en": "Adds the White Noise tones to Android's sound picker so you can choose them for notification categories, conversations or people. Adding them does not change any alert by itself.", "fi": "Lisää White Noisen äänet Androidin äänivalitsimeen, jotta voit valita ne ilmoitusluokille, keskusteluille tai henkilöille. Lisääminen ei sinänsä muuta mitään ilmoitusta.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_tone_add"], "tag": "", "shot": null}, {"id": "1140", "en": "Retries the saved notification setup work that did not finish. The message below it says which step is waiting.", "fi": "Yrittää uudelleen tallennettua ilmoitusten määritystä, joka jäi kesken. Alla oleva viesti kertoo, mikä vaihe odottaa.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_notif_push_retry"], "tag": "", "shot": null}, {"id": "1141", "en": "Blocks screenshots and hides White Noise from the preview in Android's recent apps list. Turn it off if you want to allow screenshots. This is a device setting.", "fi": "Estää kuvakaappaukset ja piilottaa White Noisen esikatselun Androidin viimeisimpien sovellusten luettelosta. Poista se käytöstä, jos haluat sallia kuvakaappaukset. Tämä on laitekohtainen asetus.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_screen_security"], "tag": "", "shot": null}, {"id": "1142", "en": "Asks your keyboard not to learn from what you type in White Noise. Some keyboards ignore the request, so it cannot be guaranteed. This is a device setting.", "fi": "Pyytää näppäimistöäsi olemaan oppimatta siitä, mitä kirjoitat White Noisessa. Jotkin näppäimistöt jättävät pyynnön huomiotta, joten sitä ei voida taata. Tämä on laitekohtainen asetus.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_incognito_keyboard"], "tag": "", "shot": null}, {"id": "1143", "en": "Asks for your device screen lock when you return to White Noise. It needs a screen lock set up in Android first. This is a device setting.", "fi": "Pyytää laitteesi näytön lukitusta, kun palaat White Noiseen. Androidiin on ensin määritettävä näytön lukitus. Tämä on laitekohtainen asetus.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_device_auth"], "tag": "", "shot": null}, {"id": "1144", "en": "Opens Android security settings so you can set up a screen lock. Device authentication needs one before you can turn it on.", "fi": "Avaa Androidin suojausasetukset, jotta voit määrittää näytön lukituksen. Laitteen todennus vaatii sen ennen kuin voit ottaa todennuksen käyttöön.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_security_settings"], "tag": "", "shot": null}, {"id": "1145", "en": "Chooses how long White Noise can stay in the background before it asks for your screen lock again. The options run from immediately to 15 minutes.", "fi": "Valitsee, kuinka kauan White Noise voi olla taustalla ennen kuin se pyytää näytön lukitusta uudelleen. Vaihtoehdot ovat heti ja enintään 15 minuuttia.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_auto_lock"], "tag": "", "shot": null}, {"id": "1146", "en": "Opens the list of people you have blocked. The number shows how many there are, and you can unblock someone from that list.", "fi": "Avaa luettelon estämistäsi henkilöistä. Luku kertoo, montako heitä on, ja voit poistaa eston luettelosta.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_blocked_users"], "tag": "", "shot": null}, {"id": "1147", "en": "Sets the disappearing-message timer for new chats and groups this profile starts. You can still change it in each conversation.", "fi": "Määrittää katoavien viestien ajastimen uusille keskusteluille ja ryhmille, jotka tämä profiili aloittaa. Voit silti muuttaa sitä jokaisessa keskustelussa.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_default_disappearing"], "tag": "", "shot": null}, {"id": "1148", "en": "Opens the options for sharing usage data and diagnostic logs, and for managing the logs stored on this device. The value shows the current setting.", "fi": "Avaa vaihtoehdot käyttötietojen ja diagnostiikkalokien jakamiselle sekä tälle laitteelle tallennettujen lokien hallinnalle. Arvo näyttää nykyisen asetuksen.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_diagnostics_link"], "tag": "", "shot": null}, {"id": "1149", "en": "Opens the network choices for automatically downloading this type of media. Every matching network rule must allow a download, and manual downloads always work.", "fi": "Avaa verkkovaihtoehdot tämäntyyppisen median automaattiselle lataukselle. Jokaisen sopivan verkkosäännön on sallittava lataus, ja manuaaliset lataukset toimivat aina.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_data_media_type"], "tag": "", "shot": null}, {"id": "1150", "en": "Restores the default automatic download rules for every media type. It is available only after you have changed them.", "fi": "Palauttaa automaattisen latauksen oletussäännöt kaikille mediatyypeille. Se on käytettävissä vain, kun olet muuttanut niitä.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_data_reset"], "tag": "", "shot": null}, {"id": "1151", "en": "Asks you to confirm, then clears the queued automatic downloads for this profile. Downloads already running and manual downloads continue.", "fi": "Pyytää vahvistuksen ja tyhjentää sitten tämän profiilin jonossa olevat automaattiset lataukset. Jo käynnissä olevat ja manuaaliset lataukset jatkuvat.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_data_queue_stop"], "tag": "", "shot": null}, {"id": "1152", "en": "Turns automatic downloads back on so they follow your network rules again.", "fi": "Ottaa automaattiset lataukset taas käyttöön, jotta ne noudattavat jälleen verkkosääntöjäsi.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_data_queue_restart"], "tag": "", "shot": null}, {"id": "1153", "en": "Chooses the size of photos and voice messages you send from now on. Videos and audio files are never re-encoded, and messages you already sent do not change.", "fi": "Valitsee tästä eteenpäin lähettämiesi kuvien ja ääniviestien koon. Videoita ja äänitiedostoja ei koskaan koodata uudelleen, eivätkä jo lähettämäsi viestit muutu.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_data_quality"], "tag": "", "shot": null}, {"id": "1154", "en": "Shows previews of public JPEG image links inside chats. It is off by default because a Blossom link may reveal your IP address to its host. Turning it off clears the previews already loaded, and links still open.", "fi": "Näyttää keskusteluissa esikatselut julkisista JPEG-kuvalinkeistä. Se on oletuksena pois päältä, koska Blossom-linkki voi paljastaa IP-osoitteesi palvelimelle. Poistaminen käytöstä tyhjentää jo ladatut esikatselut, ja linkit avautuvat edelleen.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_data_jpeg_previews"], "tag": "", "shot": null}, {"id": "1155", "en": "Opens a view of what White Noise stores on this device, with tools to free up space.", "fi": "Avaa näkymän siitä, mitä White Noise tallentaa tälle laitteelle, ja työkalut tilan vapauttamiseen.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_data_manage_storage"], "tag": "", "shot": null}, {"id": "1156", "en": "Tries to load your storage information again.", "fi": "Yrittää ladata tallennustilan tiedot uudelleen.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_retry"], "tag": "", "shot": null}, {"id": "1157", "en": "Opens a list of the largest attachments on this device, biggest first. You can select some and remove them. Messages stay, and you can download attachments again while the sender's copy is still available.", "fi": "Avaa luettelon tämän laitteen suurimmista liitteistä suurimmasta alkaen. Voit valita niistä joitakin ja poistaa ne. Viestit säilyvät, ja voit ladata liitteet uudelleen niin kauan kuin lähettäjän kopio on saatavilla.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_largest"], "tag": "", "shot": null}, {"id": "1158", "en": "Asks you to confirm, then removes attachments received before a date you choose, in every chat, from this device. Messages stay, and you can download attachments again while the sender's copy is still available.", "fi": "Pyytää vahvistuksen ja poistaa sitten tältä laitteelta kaikista keskusteluista liitteet, jotka on vastaanotettu ennen valitsemaasi päivää. Viestit säilyvät, ja voit ladata liitteet uudelleen niin kauan kuin lähettäjän kopio on saatavilla.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_remove_older"], "tag": "", "shot": null}, {"id": "1159", "en": "Asks you to confirm, then removes attachments in this chat received before a date you choose from this device. Messages stay, and you can download attachments again while the sender's copy is still available.", "fi": "Pyytää vahvistuksen ja poistaa sitten tältä laitteelta tämän keskustelun liitteet, jotka on vastaanotettu ennen valitsemaasi päivää. Viestit säilyvät, ja voit ladata liitteet uudelleen niin kauan kuin lähettäjän kopio on saatavilla.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_chat_remove_older"], "tag": "", "shot": null}, {"id": "1160", "en": "Asks you to confirm, then deletes pictures and temporary files kept on this device. The amount shown is what it frees. Profile and group pictures download again when you need them.", "fi": "Pyytää vahvistuksen ja poistaa sitten tälle laitteelle säilötyt kuvat ja väliaikaiset tiedostot. Näytetty määrä on se, mitä tilaa vapautuu. Profiili- ja ryhmäkuvat ladataan uudelleen, kun tarvitset niitä.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_clear_cache"], "tag": "", "shot": null}, {"id": "1161", "en": "Chooses how long attachments stay on this device. Older ones are removed now and as they age, and downloading one again keeps it for the full period. Messages stay.", "fi": "Valitsee, kuinka kauan liitteet säilyvät tällä laitteella. Vanhemmat poistetaan nyt ja sitä mukaa kuin ne vanhenevat, ja uudelleen ladattu liite säilyy koko jakson ajan. Viestit säilyvät.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_keep_media"], "tag": "", "shot": null}, {"id": "1162", "en": "Opens the attachments stored for this chat.", "fi": "Avaa tälle keskustelulle tallennetut liitteet.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_chat"], "tag": "", "shot": null}, {"id": "1163", "en": "Asks you to confirm, then removes every attachment in this chat from this device. Messages stay, and you can download attachments again while the sender's copy is still available.", "fi": "Pyytää vahvistuksen ja poistaa sitten kaikki tämän keskustelun liitteet tältä laitteelta. Viestit säilyvät, ja voit ladata liitteet uudelleen niin kauan kuin lähettäjän kopio on saatavilla.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_remove_all_chat"], "tag": "", "shot": null}, {"id": "1164", "en": "Selects or deselects this attachment so you can remove it together with others. Nothing is removed until you choose Remove.", "fi": "Valitsee tämän liitteen tai poistaa valinnan, jotta voit poistaa sen yhdessä muiden kanssa. Mitään ei poisteta ennen kuin valitset Poista.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_attachment"], "tag": "", "shot": null}, {"id": "1165", "en": "Selects every attachment in this list so you can remove them together. Nothing is removed until you choose Remove.", "fi": "Valitsee kaikki tämän luettelon liitteet, jotta voit poistaa ne yhdessä. Mitään ei poisteta ennen kuin valitset Poista.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_select_all"], "tag": "", "shot": null}, {"id": "1166", "en": "Selects only the attachments loaded so far. More load as you scroll, and nothing is removed until you choose Remove.", "fi": "Valitsee vain tähän mennessä ladatut liitteet. Lisää latautuu vierittäessä, eikä mitään poisteta ennen kuin valitset Poista.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_select_shown"], "tag": "", "shot": null}, {"id": "1167", "en": "Clears the current selection without removing anything.", "fi": "Tyhjentää nykyisen valinnan poistamatta mitään.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_clear_selection"], "tag": "", "shot": null}, {"id": "1168", "en": "Removes the selected attachments from this device, after you confirm. Messages stay, and you can download attachments again while the sender's copy is still available.", "fi": "Poistaa valitut liitteet tältä laitteelta vahvistuksesi jälkeen. Viestit säilyvät, ja voit ladata liitteet uudelleen niin kauan kuin lähettäjän kopio on saatavilla.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_storage_remove_selected"], "tag": "", "shot": null}, {"id": "1169", "en": "Opens a menu with the diagnostics health view, a send-to-self test and an option to clear the diagnostic entries listed on this screen.", "fi": "Avaa valikon, jossa on diagnostiikan tilanäkymä, itselle lähettämisen testi ja vaihtoehto tyhjentää tässä näkymässä luetellut diagnostiikkamerkinnät.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_diagnostics_actions"], "tag": "", "shot": null}, {"id": "1170", "en": "Reloads the diagnostic counters and status values shown in this sheet.", "fi": "Lataa uudelleen tässä näkymässä näkyvät diagnostiikkalaskurit ja tila-arvot.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_diagnostics_refresh"], "tag": "", "shot": null}, {"id": "1171", "en": "Runs a delivery test. It creates a temporary group, sends a test message to it and archives it, so you can check that sending works from this device.", "fi": "Suorittaa toimitustestin. Se luo väliaikaisen ryhmän, lähettää siihen testiviestin ja arkistoi sen, jotta voit tarkistaa, että lähettäminen toimii tältä laitteelta.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_diagnostics_send_to_self"], "tag": "", "shot": null}, {"id": "1172", "en": "Collects privacy-safe timing events on this device. It stops after 30 minutes or when the app restarts, and you can turn it off sooner. While on, the events are included in the next Stored Diagnostic Logs export.", "fi": "Kerää yksityisyyden kannalta turvallisia ajoitustapahtumia tällä laitteella. Keräys loppuu 30 minuutin kuluttua tai kun sovellus käynnistyy uudelleen, ja voit lopettaa sen aiemmin. Kun se on päällä, tapahtumat sisällytetään seuraavaan tallennettujen diagnostiikkalokien vientiin.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_diagnostics_perf_logs"], "tag": "", "shot": null}, {"id": "1173", "en": "Copies the privacy-safe timing events from the current or last session so you can paste them elsewhere.", "fi": "Kopioi nykyisen tai edellisen istunnon yksityisyyden kannalta turvalliset ajoitustapahtumat, jotta voit liittää ne muualle.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_diagnostics_perf_copy"], "tag": "", "shot": null}, {"id": "1174", "en": "Opens a list of the Marmot audit files stored on this device so you can pick specific ones to save or share.", "fi": "Avaa luettelon tälle laitteelle tallennetuista Marmot-audit-tiedostoista, jotta voit valita tietyt tiedostot tallennettaviksi tai jaettaviksi.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_audit_choose"], "tag": "", "shot": null}, {"id": "1175", "en": "Saves or shares this device's diagnostic logs as one archive. You are asked to confirm before the export starts.", "fi": "Tallentaa tai jakaa tämän laitteen diagnostiikkalokit yhtenä arkistona. Sinua pyydetään vahvistamaan ennen kuin vienti alkaa.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_audit_export"], "tag": "", "shot": null}, {"id": "1176", "en": "Removes the diagnostic logs stored on this device after you confirm. Copies already uploaded and your sharing setting stay as they are.", "fi": "Poistaa tälle laitteelle tallennetut diagnostiikkalokit vahvistuksesi jälkeen. Jo lähetetyt kopiot ja jakamisasetuksesi pysyvät ennallaan.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_audit_clear"], "tag": "", "shot": null}, {"id": "1177", "en": "Shows whether diagnostic log delivery is active, retrying, paused, off or not set up, with the HTTP status code when there is one.", "fi": "Näyttää, onko diagnostiikkalokien toimitus käynnissä, yrittääkö se uudelleen, onko se keskeytetty, pois päältä vai määrittämättä, sekä HTTP-tilakoodin, jos sellainen on.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_audit_status"], "tag": "", "shot": null}, {"id": "1178", "en": "Shows when audit log delivery last succeeded. It reads Never if none has succeeded yet.", "fi": "Näyttää, milloin audit-lokien toimitus onnistui viimeksi. Siinä lukee Ei koskaan, jos mikään ei ole vielä onnistunut.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_audit_last_success"], "tag": "", "shot": null}, {"id": "1179", "en": "Shows how much audit log data is stored on this device and waiting to upload.", "fi": "Näyttää, kuinka paljon audit-lokitietoja on tallennettu tälle laitteelle odottamaan lähetystä.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_audit_waiting"], "tag": "", "shot": null}, {"id": "1180", "en": "Tries to resume sending audit logs now. It appears only while delivery is paused.", "fi": "Yrittää jatkaa audit-lokien lähettämistä nyt. Se näkyy vain, kun toimitus on keskeytetty.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_audit_resume"], "tag": "", "shot": null}, {"id": "1181", "en": "Checks the current audit log delivery status again.", "fi": "Tarkistaa audit-lokien toimituksen nykyisen tilan uudelleen.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_audit_refresh"], "tag": "", "shot": null}, {"id": "1182", "en": "Chooses how long audit logs stay on this device. Choosing a shorter period asks you to confirm, then deletes older logs on this device, including ones still waiting to upload.", "fi": "Valitsee, kuinka kauan audit-lokit säilyvät tällä laitteella. Lyhyemmän ajan valitseminen pyytää vahvistuksen ja poistaa sitten vanhemmat lokit tältä laitteelta, myös lähetystä vielä odottavat.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_audit_retention"], "tag": "", "shot": null}, {"id": "1183", "en": "Unblocks this person. Tapping the row starts the unblock for this person only.", "fi": "Poistaa tämän henkilön eston. Rivin napauttaminen aloittaa eston poiston vain tältä henkilöltä.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_blocked_unblock"], "tag": "", "shot": null}, {"id": "1184", "en": "Silences ordinary message alerts in this conversation. Direct mentions can still notify you. Turn it off to get ordinary alerts again.", "fi": "Hiljentää tavalliset viesti-ilmoitukset tässä keskustelussa. Suorat maininnat voivat silti ilmoittaa sinulle. Poista se käytöstä saadaksesi taas tavalliset ilmoitukset.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_conversation_mute"], "tag": "", "shot": null}, {"id": "1185", "en": "Opens the vibration pattern choices for new messages in this conversation. You can preview each pattern once before choosing.", "fi": "Avaa tämän keskustelun uusien viestien värinäkuviovaihtoehdot. Voit kokeilla jokaista kuviota kerran ennen valintaa.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_conversation_vibration"], "tag": "", "shot": null}, {"id": "1186", "en": "Turns this category of alerts on or off for this conversation on this device. The line below it tells you when Android blocks the category or the chat is muted.", "fi": "Ottaa tämän ilmoitusluokan käyttöön tai pois tässä keskustelussa tällä laitteella. Alla oleva rivi kertoo, jos Android estää luokan tai keskustelu on mykistetty.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_conversation_alert"], "tag": "", "shot": null}, {"id": "1187", "en": "Opens Android's sound and notification settings for this category in this conversation. The line below shows whether this chat has its own setting or uses the global default.", "fi": "Avaa Androidin ääni- ja ilmoitusasetukset tälle luokalle tässä keskustelussa. Alla oleva rivi näyttää, onko keskustelulla oma asetuksensa vai käyttääkö se yleistä oletusta.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_conversation_category"], "tag": "", "shot": null}, {"id": "1188", "en": "Uses the chat and global notification settings for this person instead of a custom rule.", "fi": "Käyttää tälle henkilölle keskustelun ja yleisiä ilmoitusasetuksia mukautetun säännön sijaan.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_profile_defaults"], "tag": "", "shot": null}, {"id": "1189", "en": "Mutes message notifications from this person. It applies only to messages; delivery and unread counts do not change.", "fi": "Mykistää tämän henkilön viesti-ilmoitukset. Se koskee vain viestejä. Toimitus ja lukemattomien määrät eivät muutu.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_profile_mute"], "tag": "", "shot": null}, {"id": "1190", "en": "Opens Android's settings for notifications from this person, where you can set a custom sound and behavior. Custom settings apply across conversations for this account.", "fi": "Avaa Androidin asetukset tämän henkilön ilmoituksille. Niissä voit määrittää mukautetun äänen ja toiminnan. Mukautetut asetukset koskevat tämän tilin kaikkia keskusteluja.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_profile_system"], "tag": "", "shot": null}, {"id": "1191", "en": "Chooses the vibration pattern for notifications from this person.", "fi": "Valitsee tämän henkilön ilmoitusten värinäkuvion.", "ctx": ["Android explanation_privacy_strings: explanation_privacy_profile_vibration"], "tag": "", "shot": null}, {"id": "1192", "en": "Shows whether your Where I post list is published. This list tells other people which relays carry your profile and public events. Relays are servers that store and pass along events, and they cannot read your encrypted messages. If it is missing, others may not find your profile. Use Publish missing lists to fix that.", "fi": "Näyttää, onko Missä julkaisen -listasi julkaistu. Tämä lista kertoo muille, mitkä releet välittävät profiiliasi ja julkisia tapahtumiasi. Releet ovat palvelimia, jotka tallentavat ja välittävät tapahtumia, eivätkä ne voi lukea salattuja viestejäsi. Jos lista puuttuu, muut eivät ehkä löydä profiiliasi. Korjaa se valitsemalla Julkaise puuttuvat listat.", "ctx": ["Android explanation_relays_strings: explanation_relays_posting"], "tag": "", "shot": null}, {"id": "1193", "en": "Shows whether your Where I receive list is published. People send invitations to new chats and groups to these relays, and the invitations are encrypted so a relay cannot read them. If the list is missing, others may not know where to send you an invitation, and invitations may not reach you.", "fi": "Näyttää, onko Missä vastaanotan -listasi julkaistu. Ihmiset lähettävät kutsut uusiin keskusteluihin ja ryhmiin näihin releisiin, ja kutsut on salattu, joten rele ei voi lukea niitä. Jos lista puuttuu, muut eivät ehkä tiedä, minne lähettää sinulle kutsu, eivätkä kutsut välttämättä tavoita sinua.", "ctx": ["Android explanation_relays_strings: explanation_relays_receiving"], "tag": "", "shot": null}, {"id": "1194", "en": "Tries the failed relay list action again, either checking the status or publishing the missing lists. Nothing changes on your relays until it succeeds.", "fi": "Yrittää epäonnistunutta relelistan toimintoa uudelleen, joko tilan tarkistusta tai puuttuvien listojen julkaisua. Releissäsi ei muutu mikään ennen kuin se onnistuu.", "ctx": ["Android explanation_relays_strings: explanation_relays_retry"], "tag": "", "shot": null}, {"id": "1195", "en": "Checks your relays again to see whether your Where I post and Where I receive lists are published. It only reads; it does not publish or change anything.", "fi": "Tarkistaa releesi uudelleen nähdäkseen, onko Missä julkaisen- ja Missä vastaanotan -listasi julkaistu. Se vain lukee eikä julkaise tai muuta mitään.", "ctx": ["Android explanation_relays_strings: explanation_relays_refresh"], "tag": "", "shot": null}, {"id": "1196", "en": "Opens this relay’s details, where you can see its address, choose whether it is used for posting, receiving or both, or remove it. A relay is a server that stores and passes along encrypted messages and public events. Existing chats keep their own relays.", "fi": "Avaa tämän releen tiedot, joissa näet sen osoitteen, voit valita, käytetäänkö sitä julkaisuun, vastaanottoon vai molempiin, tai voit poistaa sen. Rele on palvelin, joka tallentaa ja välittää salattuja viestejä ja julkisia tapahtumia. Olemassa olevat keskustelut pitävät omat releensä.", "ctx": ["Android explanation_relays_strings: explanation_relays_relay_row"], "tag": "", "shot": null}, {"id": "1197", "en": "Adds a relay to this profile. A relay is a server that stores and passes along encrypted messages and public events. You choose whether it is used for posting, receiving or both, and your relay lists are updated so other people can see the change.", "fi": "Lisää releen tähän profiiliin. Rele on palvelin, joka tallentaa ja välittää salattuja viestejä ja julkisia tapahtumia. Valitset, käytetäänkö sitä julkaisuun, vastaanottoon vai molempiin, ja relelistasi päivitetään, jotta muut näkevät muutoksen.", "ctx": ["Android explanation_relays_strings: explanation_relays_add"], "tag": "", "shot": null}, {"id": "1198", "en": "Replaces this profile’s relays and their roles with the app defaults. Custom relays you added are removed from your lists. Existing chats keep their relays. This is unavailable while you already use the defaults.", "fi": "Korvaa tämän profiilin releet ja niiden roolit sovelluksen oletuksilla. Lisäämäsi omat releet poistetaan listoiltasi. Olemassa olevat keskustelut pitävät releensä. Tämä ei ole käytettävissä, jos käytät jo oletuksia.", "ctx": ["Android explanation_relays_strings: explanation_relays_restore"], "tag": "", "shot": null}, {"id": "1199", "en": "Confirms replacing this profile’s relays and roles with the defaults. Custom relays are removed from your lists, and you can add them again later. Existing chats keep their relays.", "fi": "Vahvistaa tämän profiilin releiden ja roolien korvaamisen oletuksilla. Omat releet poistetaan listoiltasi, ja voit lisätä ne myöhemmin uudelleen. Olemassa olevat keskustelut pitävät releensä.", "ctx": ["Android explanation_relays_strings: explanation_relays_restore_confirm"], "tag": "", "shot": null}, {"id": "1200", "en": "Stops this profile from using this relay and removes it from your lists. Existing chats keep their relays, and you can add the relay again later. It is unavailable when this relay is the last one in a list, so you always have somewhere to post and receive.", "fi": "Lopettaa tämän releen käytön tässä profiilissa ja poistaa sen listoiltasi. Olemassa olevat keskustelut pitävät releensä, ja voit lisätä releen myöhemmin uudelleen. Tämä ei ole käytettävissä, jos rele on listan viimeinen, jotta sinulla on aina paikka julkaista ja vastaanottaa.", "ctx": ["Android explanation_relays_strings: explanation_relays_remove"], "tag": "", "shot": null}, {"id": "1201", "en": "Confirms removing this relay from this profile. You can add it again later. Existing chats keep their relays.", "fi": "Vahvistaa tämän releen poistamisen tästä profiilista. Voit lisätä sen myöhemmin uudelleen. Olemassa olevat keskustelut pitävät releensä.", "ctx": ["Android explanation_relays_strings: explanation_relays_remove_confirm"], "tag": "", "shot": null}, {"id": "1202", "en": "Adds the relay with the roles you switched on and updates your relay lists. Choose at least one role first, posting or receiving, so the relay has a purpose.", "fi": "Lisää releen niillä rooleilla, jotka kytkit päälle, ja päivittää relelistasi. Valitse ensin vähintään yksi rooli, julkaisu tai vastaanotto, jotta releellä on tehtävä.", "ctx": ["Android explanation_relays_strings: explanation_relays_add_submit"], "tag": "", "shot": null}, {"id": "1203", "en": "Reloads the key packages published for this account from relays. It only reads; it does not publish or delete anything.", "fi": "Lataa releistä uudelleen tälle tilille julkaistut avainpaketit. Se vain lukee eikä julkaise tai poista mitään.", "ctx": ["Android explanation_relays_strings: explanation_relays_key_packages_refresh"], "tag": "", "shot": null}, {"id": "1204", "en": "Publishes your current local key packages to relays again without creating new ones. A key package is a public invitation key that lets other people add you to an encrypted group. Use it if others cannot invite you.", "fi": "Julkaisee nykyiset paikalliset avainpakettisi releisiin uudelleen luomatta uusia. Avainpaketti on julkinen kutsuavain, jonka avulla muut voivat lisätä sinut salattuun ryhmään. Käytä tätä, jos muut eivät voi kutsua sinua.", "ctx": ["Android explanation_relays_strings: explanation_relays_key_packages_republish"], "tag": "", "shot": null}, {"id": "1205", "en": "Creates a new key package and publishes it to relays for future invitations. Existing key packages are kept. A key package is a public invitation key that lets other people add you to an encrypted group.", "fi": "Luo uuden avainpaketin ja julkaisee sen releisiin tulevia kutsuja varten. Olemassa olevat avainpaketit säilytetään. Avainpaketti on julkinen kutsuavain, jonka avulla muut voivat lisätä sinut salattuun ryhmään.", "ctx": ["Android explanation_relays_strings: explanation_relays_key_packages_publish_new"], "tag": "", "shot": null}, {"id": "1206", "en": "Opens a confirmation to delete this key package from the relays that hold it. Others can no longer use it to invite you. You can publish a new one later.", "fi": "Avaa vahvistuksen tämän avainpaketin poistamiseksi releistä, joilla se on. Muut eivät voi enää käyttää sitä kutsuakseen sinut. Voit julkaista uuden myöhemmin.", "ctx": ["Android explanation_relays_strings: explanation_relays_key_package_delete"], "tag": "", "shot": null}, {"id": "1207", "en": "Deletes this key package from the relays that hold it. It cannot be restored, but you can publish a new key package later.", "fi": "Poistaa tämän avainpaketin releistä, joilla se on. Sitä ei voi palauttaa, mutta voit julkaista uuden avainpaketin myöhemmin.", "ctx": ["Android explanation_relays_strings: explanation_relays_key_package_delete_confirm"], "tag": "", "shot": null}, {"id": "1208", "en": "The identifier of this key package. Tap to copy the full value to the clipboard, or hold to read this note.", "fi": "Tämän avainpaketin tunniste. Napauta kopioidaksesi koko arvon leikepöydälle tai pidä painettuna lukeaksesi tämän huomautuksen.", "ctx": ["Android explanation_relays_strings: explanation_relays_key_package_id"], "tag": "", "shot": null}, {"id": "1209", "en": "The identifier of the relay event that carries this key package. Tap to copy the full value to the clipboard, or hold to read this note.", "fi": "Sen releen tapahtuman tunniste, joka sisältää tämän avainpaketin. Napauta kopioidaksesi koko arvon leikepöydälle tai pidä painettuna lukeaksesi tämän huomautuksen.", "ctx": ["Android explanation_relays_strings: explanation_relays_key_package_event"], "tag": "", "shot": null}, {"id": "1210", "en": "The reference used to identify this key package. Tap to copy the full value to the clipboard, or hold to read this note.", "fi": "Viite, jolla tämä avainpaketti tunnistetaan. Napauta kopioidaksesi koko arvon leikepöydälle tai pidä painettuna lukeaksesi tämän huomautuksen.", "ctx": ["Android explanation_relays_strings: explanation_relays_key_package_ref"], "tag": "", "shot": null}, {"id": "1211", "en": "Shows whether this device holds the private keys that match this key package, and whether it is the current one or kept for older invitations.", "fi": "Näyttää, onko tällä laitteella tätä avainpakettia vastaavat yksityiset avaimet ja onko se nykyinen vai säilytetty vanhempia kutsuja varten.", "ctx": ["Android explanation_relays_strings: explanation_relays_key_package_local_state"], "tag": "", "shot": null}, {"id": "1212", "en": "The relays where this key package was found. Deleting it asks these relays to remove it.", "fi": "Releet, joilta tämä avainpaketti löytyi. Poistaminen pyytää näitä releitä poistamaan sen.", "ctx": ["Android explanation_relays_strings: explanation_relays_key_package_seen_on"], "tag": "", "shot": null}, {"id": "1213", "en": "A group that could not be safely loaded. The text below explains how to recover it. Nothing is deleted.", "fi": "Ryhmä, jota ei voitu ladata turvallisesti. Alla oleva teksti kertoo, miten sen voi palauttaa. Mitään ei poisteta.", "ctx": ["Android explanation_relays_strings: explanation_relays_quarantine_reopen"], "tag": "", "shot": null}, {"id": "1214", "en": "One of the relays configured for this chat. The chat’s encrypted messages travel through these relays to every member. This shows the configuration only, not whether the relay is connected right now.", "fi": "Yksi tälle keskustelulle määritetyistä releistä. Keskustelun salatut viestit kulkevat näiden releiden kautta kaikille jäsenille. Tämä näyttää vain määrityksen, ei sitä, onko rele juuri nyt yhdistettynä.", "ctx": ["Android explanation_relays_strings: explanation_relays_group_relay_row"], "tag": "", "shot": null}, {"id": "1215", "en": "Copies this relay’s address to the clipboard.", "fi": "Kopioi tämän releen osoitteen leikepöydälle.", "ctx": ["Android explanation_relays_strings: explanation_relays_group_relay_copy"], "tag": "", "shot": null}, {"id": "1216", "en": "Puts back the relay you just removed in this setup step, exactly as it was.", "fi": "Palauttaa tässä käyttöönoton vaiheessa juuri poistamasi releen täsmälleen sellaisena kuin se oli.", "ctx": ["Android explanation_relays_strings: explanation_relays_setup_undo"], "tag": "", "shot": null}, {"id": "1217", "en": "Copies your private key to the clipboard, marked as sensitive. Anyone who has it controls your profile, so paste it only where you trust.", "fi": "Kopioi yksityisen avaimesi leikepöydälle arkaluonteiseksi merkittynä. Kuka tahansa, jolla se on, hallitsee profiiliasi, joten liitä se vain paikkaan, johon luotat.", "ctx": ["Android explanation_settings_strings: explanation_account_keys_copy_private"], "tag": "", "shot": null}, {"id": "1218", "en": "Your public key identifies this profile. People use it to find you, start chats and add you to groups, so it is safe to share. It cannot be used to read your messages or sign in as you.", "fi": "Julkinen avaimesi yksilöi tämän profiilin. Ihmiset käyttävät sitä löytääkseen sinut, aloittaakseen keskusteluja ja lisätäkseen sinut ryhmiin, joten sen jakaminen on turvallista. Sillä ei voi lukea viestejäsi eikä kirjautua sisään sinuna.", "ctx": ["Android explanation_settings_strings: explanation_account_keys_public_key"], "tag": "", "shot": null}, {"id": "1219", "en": "Your private key proves you are this profile. Anyone who has it can sign in and post as you, and it cannot be changed or reset. It stays hidden until you choose to show it; keep a safe backup.", "fi": "Yksityinen avaimesi todistaa, että olet tämä profiili. Kuka tahansa, jolla se on, voi kirjautua sisään ja julkaista sinuna, eikä sitä voi vaihtaa tai nollata. Se pysyy piilossa, kunnes päätät näyttää sen. Pidä siitä turvallinen varmuuskopio.", "ctx": ["Android explanation_settings_strings: explanation_account_keys_private_key"], "tag": "", "shot": null}, {"id": "1220", "en": "Saves your private key to a file you choose, locked with a password you set. You need that password to open the file.", "fi": "Tallentaa yksityisen avaimesi valitsemaasi tiedostoon asettamallasi salasanalla lukittuna. Tarvitset salasanan tiedoston avaamiseen.", "ctx": ["Android explanation_settings_strings: explanation_account_keys_export_encrypted"], "tag": "", "shot": null}, {"id": "1221", "en": "Shares your private key as plain text with an app you choose, after a warning. The encrypted export is safer.", "fi": "Jakaa yksityisen avaimesi pelkkänä tekstinä valitsemallesi sovellukselle varoituksen jälkeen. Salattu vienti on turvallisempi.", "ctx": ["Android explanation_settings_strings: explanation_account_keys_export_raw"], "tag": "", "shot": null}, {"id": "1222", "en": "Shows or hides your private key on this screen. It does not copy or share it.", "fi": "Näyttää tai piilottaa yksityisen avaimesi tässä näkymässä. Se ei kopioi eikä jaa avainta.", "ctx": ["Android explanation_settings_strings: explanation_account_keys_reveal"], "tag": "", "shot": null}, {"id": "1223", "en": "Signs out of this profile on this device. Groups, history and drafts stay, and you can sign back in from the account picker.", "fi": "Kirjaa sinut ulos tästä profiilista tällä laitteella. Ryhmät, historia ja luonnokset säilyvät, ja voit kirjautua takaisin tilinvalitsimesta.", "ctx": ["Android explanation_settings_strings: explanation_account_keys_sign_out"], "tag": "", "shot": null}, {"id": "1224", "en": "Permanently removes this account from this device, including messages, group encryption data and the stored key. You can sign in again with the same key, but past groups are gone.", "fi": "Poistaa tämän tilin pysyvästi tältä laitteelta, mukaan lukien viestit, ryhmien salaustiedot ja tallennetun avaimen. Voit kirjautua uudelleen samalla avaimella, mutta aiemmat ryhmät ovat poissa.", "ctx": ["Android explanation_settings_strings: explanation_account_keys_wipe"], "tag": "", "shot": null}, {"id": "1225", "en": "When on, your published invitation keys are removed from relays as you sign out, so nobody can invite you to new groups while you are signed out.", "fi": "Kun asetus on päällä, julkaistut kutsuavaimesi poistetaan releistä uloskirjautumisen yhteydessä, joten kukaan ei voi kutsua sinua uusiin ryhmiin, kun olet kirjautunut ulos.", "ctx": ["Android explanation_settings_strings: explanation_account_keys_signout_invitation_keys"], "tag": "", "shot": null}, {"id": "1226", "en": "Opens Share & Connect for this profile. Tap the short key to copy the full public key instead.", "fi": "Avaa tämän profiilin Jaa ja yhdistä -näkymän. Napauta lyhyttä avainta, jos haluat sen sijaan kopioida koko julkisen avaimen.", "ctx": ["Android explanation_settings_strings: explanation_settings_profile_row"], "tag": "", "shot": null}, {"id": "1227", "en": "Opens the options for this profile picture.", "fi": "Avaa tämän profiilikuvan vaihtoehdot.", "ctx": ["Android explanation_settings_strings: explanation_settings_profile_picture"], "tag": "", "shot": null}, {"id": "1228", "en": "Opens the relays this profile uses. A relay is a server that stores and passes along encrypted messages and public events such as your profile. Here you choose which relays you post to and receive invitations from, and add or remove them. A relay can see public events, but not what your encrypted messages say.", "fi": "Avaa releet, joita tämä profiili käyttää. Rele on palvelin, joka tallentaa ja välittää salattuja viestejä ja julkisia tapahtumia, kuten profiilisi. Täällä valitset, mihin releisiin julkaiset ja mistä vastaanotat kutsuja, ja lisäät tai poistat niitä. Rele näkee julkiset tapahtumat mutta ei salattujen viestiesi sisältöä.", "ctx": ["Android explanation_settings_strings: explanation_settings_relays"], "tag": "", "shot": null}, {"id": "1229", "en": "Turns this relay on or off in Where I post, the list of relays that carry your profile and connection info so other people can find you. Your profile is public, so any relay that stores it can read it. At least one relay has to stay in the list.", "fi": "Kytkee tämän releen päälle tai pois Missä julkaisen -listalla, joka sisältää releet, jotka välittävät profiiliasi ja yhteystietojasi, jotta muut löytävät sinut. Profiilisi on julkinen, joten mikä tahansa sitä tallentava rele voi lukea sen. Listalla on oltava vähintään yksi rele.", "ctx": ["Android explanation_settings_strings: explanation_relays_role_profile"], "tag": "", "shot": null}, {"id": "1230", "en": "Turns this relay on or off in Where I receive, the list of relays where people send you invitations to new chats and groups. Invitations are encrypted, so the relay cannot read them. If the list is empty, invitations may not reach you, so at least one relay has to stay on.", "fi": "Kytkee tämän releen päälle tai pois Missä vastaanotan -listalla, joka sisältää releet, joihin ihmiset lähettävät sinulle kutsuja uusiin keskusteluihin ja ryhmiin. Kutsut on salattu, joten rele ei voi lukea niitä. Jos lista on tyhjä, kutsut eivät välttämättä tavoita sinua, joten vähintään yhden releen on oltava päällä.", "ctx": ["Android explanation_settings_strings: explanation_relays_role_inbox"], "tag": "", "shot": null}, {"id": "1231", "en": "Publishes the relay lists marked Missing, Where I post and Where I receive. Other people look these lists up to find your profile and to know where to send you invitations. Until they are published, people may not be able to reach you. Only missing lists are published.", "fi": "Julkaisee Puuttuu-merkityt relelistat, Missä julkaisen ja Missä vastaanotan. Muut hakevat nämä listat löytääkseen profiilisi ja tietääkseen, minne lähettää sinulle kutsuja. Ennen kuin ne on julkaistu, ihmiset eivät ehkä tavoita sinua. Vain puuttuvat listat julkaistaan.", "ctx": ["Android explanation_settings_strings: explanation_relays_publish_missing"], "tag": "", "shot": null}, {"id": "1232", "en": "Removes this relay from your relay lists in this setup step. You can undo it right after.", "fi": "Poistaa tämän releen relelistoiltasi tässä käyttöönoton vaiheessa. Voit kumota sen heti perään.", "ctx": ["Android explanation_settings_strings: explanation_account_setup_remove_relay"], "tag": "", "shot": null}, {"id": "1233", "en": "Shows the key packages published for this account, which let others invite you to groups, and lets you manage them.", "fi": "Näyttää tälle tilille julkaistut avainpaketit, joiden avulla muut voivat kutsua sinut ryhmiin, ja antaa sinun hallita niitä.", "ctx": ["Android explanation_settings_string
